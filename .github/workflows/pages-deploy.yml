name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Check post metadata
        run: bundle exec ruby tools/check_blog_metadata.rb

      - name: Check article asset fingerprints
        run: bundle exec ruby tools/test_article_lab_assets.rb

      - name: Check article interactions
        run: |
          for test in tools/test_article_labs_*.js; do
            node "$test"
          done
          node tools/check_article_labs_models.js

      - name: Check A-star article and exercises
        run: |
          node tools/test_pathfinding_core.js
          node tools/test_search_unweighted.js
          node tools/test_search_dijkstra.js
          node tools/test_search_astar.js
          node tools/test_astar_exercises.js
          node tools/test_search_checkpoints.js
          python3 tools/check_astar_article.py

      - name: Check local editor boundaries
        run: |
          for test in tools/local_editor/test_*.rb; do
            bundle exec ruby "$test"
          done
          node tools/local_editor/test_client_state.js
          node tools/local_editor/test_widget_state.js

      - name: Check sorting article and exercises
        run: |
          node tools/test_sorting.js
          python3 tools/test_sorting_python.py
          python3 tools/check_sorting_article.py

      - name: Check quantum transport interaction
        run: node tools/test_negf_core.js

      - name: Setup Python for Galois checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Galois article and exercises
        run: |
          python -m pip install sympy==1.14.0
          node tools/test_galois.js
          python tools/test_galois_math.py --sympy required --require-assets
          python tools/check_galois_article.py

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
