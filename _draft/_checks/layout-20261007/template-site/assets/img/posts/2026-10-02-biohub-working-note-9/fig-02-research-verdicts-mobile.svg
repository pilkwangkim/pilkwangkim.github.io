   <g id="text_1">
    <text style="font-weight: 700; font-size: 19.44px; font-family: 'Arial'; text-anchor: start; fill: #087f8c" x="21.6" y="35.514788" transform="rotate(-0 21.6 35.514788)">BIOHUB / NOTE 9</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 30.24px; font-family: 'Arial'; fill: #1d252d" transform="translate(21.6 81.773775)">Four findings,</text>
    <text style="font-weight: 700; font-size: 30.24px; font-family: 'Arial'; fill: #1d252d" transform="translate(21.6 115.194881)">four different next actions</text>
   </g>
   <g id="text_3">
    <text style="font-size: 20.88px; font-family: 'Helvetica Neue'; text-anchor: start; fill: #586570" x="21.6" y="160.701975" transform="rotate(-0 21.6 160.701975)">Conceptual map of evidence scope</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 25.92px; font-family: 'Arial'; text-anchor: start; fill: #b55332" x="41.76" y="230.23305" transform="rotate(-0 41.76 230.23305)">Negative graph result</text>
   </g>
   <g id="text_5">
    <text style="font-size: 23.76px; font-family: 'Helvetica Neue'; fill: #1d252d" transform="translate(41.76 281.206125)">The measured</text>
    <text style="font-size: 23.76px; font-family: 'Helvetica Neue'; fill: #1d252d" transform="translate(41.76 307.095244)">composition loses.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 22.32px; font-family: 'Helvetica Neue'; fill: #586570" transform="translate(41.76 351.457875)">Reject that composition; inspect</text>
    <text style="font-size: 22.32px; font-family: 'Helvetica Neue'; fill: #586570" transform="translate(41.76 375.777956)">where the loss occurs.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 25.92px; font-family: 'Arial'; text-anchor: start; fill: #087f8c" x="41.76" y="458.06895" transform="rotate(-0 41.76 458.06895)">Training insufficient</text>
   </g>
   <g id="text_8">
    <text style="font-size: 23.76px; font-family: 'Helvetica Neue'; fill: #1d252d" transform="translate(41.76 508.726125)">The model did not</text>
    <text style="font-size: 23.76px; font-family: 'Helvetica Neue'; fill: #1d252d" transform="translate(41.76 534.615244)">learn enough.</text>
   </g>
   <g id="text_9">
    <text style="font-size: 22.32px; font-family: 'Helvetica Neue'; fill: #586570" transform="translate(41.76 579.354525)">Check exposure and convergence;</text>
    <text style="font-size: 22.32px; font-family: 'Helvetica Neue'; fill: #586570" transform="translate(41.76 604.165472)">justify any change in support.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 25.92px; font-family: 'Arial'; text-anchor: start; fill: #687887" x="41.76" y="685.27305" transform="rotate(-0 41.76 685.27305)">Execution incomplete</text>
   </g>
   <g id="text_11">
    <text style="font-size: 23.76px; font-family: 'Helvetica Neue'; fill: #1d252d" transform="translate(41.76 736.246125)">The run did not</text>
    <text style="font-size: 23.76px; font-family: 'Helvetica Neue'; fill: #1d252d" transform="translate(41.76 762.135244)">reach scoring.</text>
   </g>
   <g id="text_12">
    <text style="font-size: 22.32px; font-family: 'Helvetica Neue'; fill: #586570" transform="translate(41.76 806.497875)">Repair the blocked execution;</text>
    <text style="font-size: 22.32px; font-family: 'Helvetica Neue'; fill: #586570" transform="translate(41.76 831.040284)">measure before judging quality.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 25.92px; font-family: 'Arial'; text-anchor: start; fill: #716394" x="41.76" y="912.79305" transform="rotate(-0 41.76 912.79305)">Bounded diagnostic</text>
   </g>
   <g id="text_14">
    <text style="font-size: 23.76px; font-family: 'Helvetica Neue'; fill: #1d252d" transform="translate(41.76 963.766125)">The probe answers</text>
    <text style="font-size: 23.76px; font-family: 'Helvetica Neue'; fill: #1d252d" transform="translate(41.76 989.655244)">a narrow question.</text>
   </g>
   <g id="text_15">
    <text style="font-size: 22.32px; font-family: 'Helvetica Neue'; fill: #586570" transform="translate(41.76 1034.017875)">Use it to choose the next test;</text>
    <text style="font-size: 22.32px; font-family: 'Helvetica Neue'; fill: #586570" transform="translate(41.76 1058.337956)">keep its interpretation within scope.</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 25.92px; font-family: 'Arial'; fill: #1d252d" transform="translate(21.6 1157.59305)">Search exhaustion needs</text>
    <text style="font-weight: 700; font-size: 25.92px; font-family: 'Arial'; fill: #1d252d" transform="translate(21.6 1185.899513)">broader evidence</text>
   </g>
   <g id="text_17">
    <text style="font-size: 20.88px; font-family: 'Helvetica Neue'; fill: #586570" transform="translate(21.6 1228.109625)">Across alternatives, training support,</text>
    <text style="font-size: 20.88px; font-family: 'Helvetica Neue'; fill: #586570" transform="translate(21.6 1251.111881)">and complete pipelines.</text>
   </g>
  </g>
