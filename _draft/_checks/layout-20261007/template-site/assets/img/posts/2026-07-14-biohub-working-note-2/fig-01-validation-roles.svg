<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1d1f21}.title{font-size:31px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:20px}.small{font-size:17px;fill:#55595e}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#007c9c"/></marker></defs><rect width="1200" height="620" fill="white"/><text x="50" y="55" class="title">The July 14 plan: separate training and evaluation</text><text x="50" y="90" class="small">First diagnostic: fixed 100-epoch checkpoints; the two embryo-held-out models were still training.</text><rect x="50" y="180" width="330" height="245" rx="12" fill="#eff6f8" stroke="#8ec5d4"/><text x="70" y="222" class="small">FOLD MODELS</text><text x="70" y="285" class="small">Train one model per embryo</text><text x="70" y="327" class="small">Use the fixed epoch 100</text><text x="70" y="369" class="small">Hold out the other embryo</text><rect x="435" y="180" width="330" height="245" rx="12" fill="#eff6f8" stroke="#8ec5d4"/><text x="455" y="222" class="small">POLICY DEVELOPMENT</text><text x="455" y="285" class="small">Replay anchor graph stages</text><text x="455" y="327" class="small">Separate fit and calibration</text><text x="455" y="369" class="small">Freeze policy and thresholds</text><rect x="820" y="180" width="330" height="245" rx="12" fill="#eff6f8" stroke="#8ec5d4"/><text x="840" y="222" class="small">GRAPH EVALUATION</text><text x="840" y="285" class="small">Apply the frozen policy</text><text x="840" y="327" class="small">Score the complete graph</text><text x="840" y="369" class="small">Compare with replayed anchor</text><path d="M382 305L428 305" stroke="#007c9c" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M767 305L813 305" stroke="#007c9c" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="50" y="485" class="body">Each embryo is held out once; every movie receives one fold-model prediction.</text><text x="50" y="525" class="body">199 movies provide coverage; they still come from only two embryo domains.</text><text x="50" y="570" class="small">The July plan still needed to check transfer from fold models to the all-train submission.</text></svg>