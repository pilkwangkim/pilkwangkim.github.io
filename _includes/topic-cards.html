{% for topic_card in include.topics %}
  <a class="topic-card" href="{{ topic_card.url | relative_url }}" data-topic-entry="{{ topic_card.id }}" data-post-languages="{{ topic_card.languages | join: ' ' }}" lang="en">
    <div class="topic-card-heading">
      <h3>{{ topic_card.title | escape }}</h3>
      <i class="fas fa-arrow-right" aria-hidden="true"></i>
    </div>
    <p>{{ topic_card.description | escape }}</p>
    <span class="topic-card-meta">{{ topic_card.article_count }} {% if topic_card.article_count == 1 %}article{% else %}articles{% endif %}</span>
  </a>
{% endfor %}
