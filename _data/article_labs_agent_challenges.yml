security-trust-puzzle:
  bundle: agent-challenges
  stylesheet: /assets/css/agent-challenges.css
  title:
    en: "Trust-boundary puzzle: who authorized that action?"
    ko: "신뢰 경계 퍼즐: 누가 그 행동을 허용했을까?"
  note:
    en: "Four authored scenarios use fixed user requests, retrieved messages and tool choices. A correct decision both preserves the request’s permission scope and completes its authorized task. All tool names and example.org/example.com destinations are inert text."
    ko: "직접 구성한 시나리오 4개의 사용자 요청·외부 메시지·도구 선택은 고정되어 있다. 올바른 판단은 권한 범위를 지키면서 허용된 작업을 끝내야 한다. 도구 이름과 example.org/example.com 목적지는 동작하지 않는 텍스트다."
gemma-test-challenge:
  bundle: agent-challenges
  stylesheet: /assets/css/agent-challenges.css
  title:
    en: "Break the patch: write your own regression test"
    ko: "패치를 깨 보세요: 회귀 테스트 직접 만들기"
  note:
    en: "The limit exercise reproduces the article’s invented API contract for null and nonnegative integers. The first-index exercise is an additional bounded example. Displayed JavaScript patches run as fixed pure functions; inputs are parsed as JSON, never as code. The last eight valid tests are retained locally in this widget."
    ko: "limit 연습은 본문의 가상 API 명세에서 null과 음이 아닌 정수 범위를 재현한다. 첫 index 연습은 별도의 제한된 예제다. 표시된 JavaScript 패치는 고정된 순수 함수로 실행되며, 입력은 코드가 아닌 JSON으로만 해석한다. 최근 유효한 테스트 8개를 이 위젯 안에 보관한다."
