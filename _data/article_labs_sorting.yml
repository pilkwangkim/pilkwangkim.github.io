sorting-playground:
  bundle: sorting
  stylesheet: /assets/css/sorting-lab.css
  title: {en: "Sorting playground: follow the records", ko: "Sorting playground: record가 움직이는 과정"}
  note: {en: "Keys are 2–24 integers in 0–99. Only numeric keys are compared; equal-key records retain identity suffixes a,b,… from input order. Seven algorithms: strict-min selection; early-exit bubble; >-shift insertion; stable upper-bound binary insertion; top-down stable merge; deterministic first-record-pivot 3-way quicksort; bottom-up binary max-heap sort. Key comparisons count actual key-to-key tests, not index/bounds tests. Record-array writes count main and auxiliary record-array assignments; a nontrivial swap is two writes, a self-swap zero. Holding a scalar temporary and recording teaching snapshots are not counted. Merge explicitly copies a run to an auxiliary array and back. Counts are implementation-specific, not exact universal formulas or wall-clock timings. Trace length is bounded at 12,000 events, and controls cancel running timers on Reset. Browser-local data only.", ko: "Key는 0–99 사이 정수 2–24개입니다. 숫자 key만 비교하며 같은 key에는 입력 순서대로 a,b,…를 붙입니다. Strict-min selection, early-exit bubble, >일 때 shift하는 insertion, upper-bound를 쓰는 stable binary insertion, top-down stable merge, 첫 record를 pivot으로 고르는 deterministic 3-way quicksort, bottom-up binary max-heap sort를 제공합니다. Key끼리 비교한 횟수만 세고, index와 경계를 검사하는 연산은 세지 않습니다. Record array의 쓰기 횟수에는 main array와 auxiliary array에 값을 넣는 연산을 모두 포함합니다. 서로 다른 두 index의 swap은 쓰기 두 번, self-swap은 0번입니다. Scalar temporary와 시각화 snapshot은 세지 않습니다. Merge는 run을 auxiliary array에 복사한 뒤 다시 씁니다. 이 counter는 현재 구현의 연산 횟수입니다. 모든 구현에 적용되는 공식이나 실제 실행 시간은 아닙니다. Trace는 12,000단계로 제한하고 Reset하면 재생 timer를 취소합니다. 모든 계산은 브라우저 안에서 이루어집니다."}
sorting-random:
  bundle: sorting
  title: {en: "Shuffle until sorted: how long is n!?", ko: "정렬될 때까지 섞기: n!은 얼마나 클까?"}
  note: {en: "Distinct keys 1..n, n=3..7; reverse input starts unsorted. Each attempt is a complete Fisher–Yates shuffle using the seeded 32-bit LCG (1664525x+1013904223 mod 2^32), for reproducible demonstrations. At most 2,000 attempts are generated; reaching the limit is not success. The theoretical success probability 1/n! and expected n! attempts assume independent uniformly random permutations; a finite pseudorandom seeded run is not that assumption or a worst-case guarantee. A shuffle takes Θ(n) writes; checking sortedness takes O(n), so the usual expected random-sort time is O(n·n!) under that model. No finite worst-case attempt bound exists for unbounded random shuffling.", ko: "서로 다른 key 1..n을 쓰며 n=3..7입니다. 역순 입력에서 시작합니다. 32-bit LCG (1664525x+1013904223 mod 2^32)와 Fisher–Yates shuffle을 사용합니다. Seed를 고정하면 같은 과정을 다시 실행할 수 있습니다. 최대 2,000회까지만 시도하며 제한에 도달한 것은 성공이 아닙니다. 1회 성공 확률이 1/n!이고 expected shuffle 횟수가 n!이라는 계산은, 매 시도에서 모든 permutation을 독립적으로 같은 확률로 고른다고 가정합니다. 고정된 seed의 유한한 pseudorandom 시연은 이 가정과 다르며, worst case를 보장하지도 않습니다. Shuffle은 Θ(n), sortedness 확인은 O(n)이므로 이 cost model에서 통상적인 expected time은 O(n·n!)입니다. 시도 횟수를 제한하지 않은 bogosort에는 유한한 worst-case bound가 없습니다."}
sorting-inversions:
  bundle: sorting
  title: {en: "Inversion game: remove the disorder", ko: "Inversion game: 거꾸로 놓인 pair 줄이기"}
  note: {en: "An inversion is an index pair i<j with a[i]>a[j]; equal keys do not count. Swapping adjacent inverted keys decreases I by exactly one; swapping an ordered pair increases I by one, and equal keys leave I unchanged. The manual board is separate from an insertion/binary-insertion trace regenerated from its current keys. Both stable variants shift exactly I records, but their writes also include one final placement for each inserted record. Binary search changes comparisons, not how many larger prefix records must move. Presets contain 4–5 keys. Animation counters and manual swap counts are separate.", ko: "Inversion은 i<j인데 a[i]>a[j]인 index pair입니다. 같은 key는 세지 않습니다. 순서가 뒤집힌 이웃을 바꾸면 I가 정확히 하나 줄어듭니다. 순서가 맞는 이웃을 바꾸면 하나 늘고, 같은 key끼리 바꾸면 그대로입니다. 직접 조작하는 입력과 insertion·binary-insertion trace는 별개이며, 현재 입력이 바뀌면 trace를 새로 만듭니다. 두 stable 구현 모두 I번 shift하지만 쓰기 횟수에는 삽입할 record의 마지막 배치도 포함합니다. Binary search는 비교를 줄일 뿐, 삽입할 값보다 큰 record를 뒤로 미는 횟수는 줄이지 못합니다. 예제는 key 4–5개이며 직접 swap과 trace 연산 횟수를 따로 셉니다."}
sorting-merge:
  bundle: sorting
  title: {en: "Merge two runs: who wins a tie?", ko: "두 run 합치기: key가 같으면 어느 쪽을 고를까?"}
  note: {en: "Original sequence is left run [2a,4,6a] followed by right run [2b,3,6b]. Each run is already sorted. Pick buttons append the selected run head even when it is the wrong next choice; sortedness and equal-key stability are then inspected independently. A stable merge takes the left head on equal keys because all original left-run records preceded the right run. Undo removes one pick. Complete stable merge applies the correct rule only to the remaining records; it does not undo an earlier incorrect pick. No key writes or comparisons are timed here.", ko: "원래 입력은 왼쪽 run [2a,4,6a] 뒤에 오른쪽 run [2b,3,6b]가 이어진 배열입니다. 두 run은 각각 정렬돼 있습니다. 선택한 record는 정답 여부와 관계없이 output 뒤에 들어갑니다. 따라서 sortedness와 stability가 각각 어떻게 달라지는지 확인할 수 있습니다. 원래 왼쪽 run이 앞에 있었으므로 stable merge는 key가 같을 때 왼쪽을 고릅니다. Undo는 마지막 선택 하나를 되돌립니다. 끝까지 실행하는 버튼은 남은 record에만 올바른 규칙을 적용합니다. 앞에서 잘못 고른 record를 되돌리지는 않습니다. 이 활동은 key 쓰기·비교 시간을 측정하지 않습니다."}
sorting-partition:
  bundle: sorting
  title: {en: "Dutch flag: shrink the unknown region", ko: "Dutch flag: 아직 확인하지 않은 구간 줄이기"}
  note: {en: "Array contains 2–24 keys, each 0,1,2. Invariants: [0,low) are 0; [low,mid) are 1; [mid,high] unknown; (high,n) are 2. A 0 swaps with low and advances low and mid. A 1 advances mid. A 2 swaps with high and decreases high without advancing mid, because the incoming value is unclassified. The unknown length high-mid+1 decreases by one each iteration, yielding exactly n iterations and at most 2n record-array writes with self-swaps omitted. This in-place partition is not stable. Visual snapshots are auxiliary teaching data, not algorithm workspace.", ko: "Key가 0,1,2인 record 2–24개를 사용합니다. Invariant는 [0,low)가 0, [low,mid)가 1, [mid,high]가 unknown, (high,n)이 2라는 것입니다. 0이면 low와 바꾸고 low·mid를 옮깁니다. 1이면 mid만 옮깁니다. 2이면 high와 바꾸고 high만 줄입니다. 들어온 값은 아직 확인하지 않았으므로 mid를 옮기면 안 됩니다. Unknown 구간의 길이 high-mid+1은 매번 하나 줄어 정확히 n번의 iteration으로 끝나며, self-swap을 빼면 record array 쓰기는 최대 2n번입니다. 이 in-place partition은 stable하지 않습니다. 시각화용 snapshot은 알고리즘의 workspace에 포함하지 않습니다."}
sorting-distribution:
  bundle: sorting
  title: {en: "Stable buckets: counting and LSD radix", ko: "Stable bucket: counting과 LSD radix"}
  note: {en: "2–16 keys in 0–99. Counting uses max(key)+1 buckets and appends records in input order. LSD radix uses base 2 or 10 and scans places 1,b,b²,… through the highest digit, preserving queue order in each bucket. Records are gathered back in increasing bucket order. Every bucket append and output slot assignment counts as a record-array write; count/index arithmetic is not counted. Empty buckets are omitted visually, but still contribute to K/base and the Θ(n+K) or Θ(d(n+b)) cost models. During output writing the main array may temporarily repeat identities because it is only partly overwritten; the complete buckets retain all records. These pedagogical queue buckets have Θ(n+K) space; this is not an in-place radix implementation.", ko: "0–99 사이 key 2–16개를 사용합니다. Counting은 max(key)+1개의 bucket을 만들고 입력 순서대로 뒤에 넣습니다. LSD radix는 base 2 또는 10에서 Digit 위치 1,b,b²,…를 차례로 처리하며 bucket 안의 순서를 유지합니다. 그다음 bucket 번호 순서로 다시 씁니다. Bucket 뒤에 넣기와 output slot에 쓰기를 각각 record array 쓰기 한 번으로 셉니다. Count·index 계산은 세지 않습니다. 빈 bucket은 그림에서만 생략하며 K·base와 Θ(n+K), Θ(d(n+b)) 비용에는 포함합니다. Main array를 다시 쓰는 중에는 일부 위치만 갱신돼 같은 record가 잠깐 중복 표시될 수 있습니다. 이때도 전체 record는 bucket에 남아 있습니다. Queue bucket을 쓰는 이 구현의 공간은 Θ(n+K)이며 in-place radix가 아닙니다."}
sorting-quiz:
  bundle: sorting
  title: {en: "Sorting concepts: five illustrated problems", ko: "그림으로 확인하는 정렬의 핵심 원리"}
  note: {en: "Five fixed inputs test the sorting/stability contract [2a,1a,2b], the minimum adjacent-swap count for [4,3,2,1], 3-way quicksort on [4,4,4,4], direct-address counting with range 0..1,000,000 and n=5, and a Dutch-flag update at [1,2,0]. Each problem states its allowed operations and names the concept being tested. Hints do not reveal the option; a choice reveals both option-specific feedback and the full reasoning. Previous/Next preserves selections; Reset clears all answers and hints. Suffixes identify records, not secondary sort keys. Choices stay in the current browser activity and are not submitted.", ko: "다섯 입력으로 정렬 조건과 stability([2a,1a,2b]), adjacent swap의 최소 횟수([4,3,2,1]), 같은 key의 3-way quicksort([4,4,4,4]), key 범위 0..1,000,000과 n=5에서의 counting 비용, [1,2,0]의 Dutch-flag 갱신 규칙을 묻습니다. 문제마다 허용된 연산과 확인할 개념을 명시합니다. 힌트는 답을 바로 알려주지 않으며, 보기를 고르면 그 선택의 이유와 전체 해설이 나옵니다. 이전·다음으로 이동해도 선택이 남고 Reset하면 답과 힌트를 초기화합니다. a,b는 record 이름이지 추가 정렬 기준이 아닙니다. 선택한 답은 현재 실습 화면에만 남고 외부로 전송되지 않습니다."}
sorting-code:
  bundle: sorting
  title: {en: "Sort Colors: complete the partition invariant", ko: "Sort Colors: 세 pointer로 partition 완성하기"}
  note: {en: "Guided Sort Colors decisions, not arbitrary Python execution. Choose the loop condition and whether each 0-swap/2-swap advances mid; low always advances for 0 and high always decreases for 2. The compact Python outline omits the browser runner's counters and finite safety guard. Eight exact cases cover empty, singleton, sorted, reverse, recheck [1,2,0], all-2, mixed and a 24-record cycle. Expand each result for the tested concept, actual/expected arrays, terminal pointers, work counts and diagnosis. Each run stops after at most n iterations or on an invalid pointer invariant. Pass requires sorted output, an empty unknown interval, iterations<=n and writes<=2n; LIMIT is not success. Self-swaps count zero writes. The common API mutates and returns the original list. Visual trace snapshots are not algorithm workspace. The downloadable Python starter is fully runnable with the same three editable decisions and built-in counters; some initial cases intentionally fail.", ko: "Sort Colors의 세 규칙을 직접 고르는 실습입니다. 임의의 Python 코드를 실행하는 기능은 아닙니다. 반복 조건과 0·2를 바꾼 뒤 mid를 옮길지 결정합니다. 0에서는 low가 항상 증가하고 2에서는 high가 항상 감소합니다. 화면의 간단한 Python 코드에는 실행기의 counter와 안전장치가 생략돼 있습니다. 빈 입력·원소 하나·정렬됨·역순·[1,2,0]·모두 2·혼합·24개 반복 입력의 여덟 case를 사용합니다. 각 결과를 펼치면 확인하는 개념, 결과·정답 배열, 마지막 pointer, 작업량, 실패 이유가 나옵니다. Iteration이 n번에 도달하거나 pointer invariant를 위반하면 실행을 멈춥니다. 정렬된 결과, 비어 있는 unknown 구간, iteration<=n, 쓰기<=2n을 모두 만족해야 통과하며 LIMIT는 성공이 아닙니다. Self-swap은 쓰기 0번입니다. 원래 list를 직접 바꾸고 같은 list를 반환하는 API를 사용합니다. 시각화용 snapshot은 알고리즘의 workspace에 포함하지 않습니다. 내려받는 Python starter도 바로 실행할 수 있고, 같은 세 규칙을 고칠 수 있습니다. Counter도 이미 들어 있습니다. 처음에는 일부 case에서 실패합니다."}
