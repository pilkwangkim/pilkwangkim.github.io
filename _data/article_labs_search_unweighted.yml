search-dfs-maze:
  bundle: search-unweighted
  stylesheet: /assets/css/search-unweighted.css
  title: {en: "Carve a maze with DFS, then escape it", ko: "DFS로 maze를 만들고 직접 빠져나오기"}
  note: {en: "Randomized DFS generates an undirected rectangular maze; this phase constructs the graph rather than searching for a goal. It starts at cell (0,0), chooses an unvisited orthogonal neighbor uniformly from right/down/left/up candidates, removes the wall, and pushes the neighbor. With no unvisited neighbor it pops. A seeded 32-bit LCG makes every run reproducible. A completed N-cell maze has N−1 passages, is connected and has no cycles; each cell pair has one simple route. The player may walk through existing passages and undo. Counts exclude waiting, and the DFS stack is not the player's route. Seeds 0–999999, grids at most 7×5 in this UI. No score is stored or transmitted.", ko: "Randomized DFS로 무방향 rectangular maze를 만듭니다. 이 단계는 goal을 찾는 탐색이 아니라 graph 생성입니다. (0,0)에서 시작해 오른쪽·아래·왼쪽·위 중 아직 방문하지 않은 이웃 하나를 같은 확률로 고르고 벽을 없앤 뒤 stack에 넣습니다. 후보가 없으면 pop합니다. Seed를 받는 32-bit LCG를 쓰므로 실행을 재현할 수 있습니다. 완성된 N-cell maze는 통로가 N−1개이고, 모든 cell이 연결되며 cycle이 없습니다. 두 cell 사이의 simple route는 하나입니다. 생성 후에는 통로로 직접 이동하거나 되돌릴 수 있습니다. DFS stack과 플레이어의 경로는 별개입니다. UI는 seed 0–999999, 최대 7×5 grid를 지원합니다. 점수는 저장하거나 전송하지 않습니다."}
search-dfs-queens:
  bundle: search-unweighted
  stylesheet: /assets/css/search-unweighted.css
  title: {en: "N-Queens: try a branch, prune, and backtrack", ko: "N-Queens: 직접 놓고 pruning과 backtracking 보기"}
  note: {en: "N=4, 5 or 6. A search state is a partial list of queen rows, one per consecutive column; rows and columns are shown from 1. Candidate rows are checked from top to bottom. Equal rows and equal absolute row/column differences conflict; one queen per column is built into the representation. Each step checks one candidate, records a complete solution, or returns from a completed branch. The solver starts from an empty board independently of manual placements and enumerates all solutions, counting rotations and reflections separately. A displayed solution is saved before the solver resumes backtracking. Saved-solution buttons pause the solver and display a complete placement without modifying its state or counts; Step/Run resumes an unfinished search. After enumeration the first saved solution remains on the board. Unsafe candidates are never expanded. No score or board state is persisted.", ko: "N은 4·5·6 중에서 고릅니다. Search state는 연속된 column마다 Queen의 row를 하나씩 적은 partial list이며 화면에서는 row와 column을 1부터 셉니다. 후보 row는 위에서부터 검사합니다. Row가 같거나 row 차이의 절댓값이 column 차이와 같으면 충돌합니다. Column당 하나라는 조건은 state 표현에 이미 반영돼 있습니다. 한 단계마다 후보 하나를 검사하거나 완성된 해를 저장하거나 끝난 branch에서 돌아옵니다. Solver는 수동 배치와 별개로 빈 board에서 시작해 모든 해를 찾습니다. 회전·대칭 배치도 각각 셉니다. 해를 화면에 보여 준 다음 backtracking을 계속합니다. 저장한 해를 누르면 solver를 멈추고 완성된 배치를 보여 줍니다. 탐색 state와 횟수는 바뀌지 않으며, 아직 끝나지 않은 탐색은 DFS 한 단계나 실행으로 이어 갈 수 있습니다. 모든 해를 찾은 뒤에도 첫 번째 해를 board에 남겨 둡니다. 충돌하는 후보에서는 더 내려가지 않습니다. 점수나 board state는 저장하지 않습니다."}
search-bfs-words:
  bundle: search-unweighted
  stylesheet: /assets/css/search-unweighted.css
  title: {en: "Word ladder: change COLD into WARM", ko: "Word ladder: COLD를 WARM으로 바꾸기"}
  note: {en: "A finite authored dictionary is the complete vertex set, not a claim about all English words. An undirected edge joins two words of equal length if exactly one letter differs; each edge costs 1. Click a legal neighbor to build your chain. BFS uses alphabetically ordered neighbors, marks states when enqueued, and checks the goal when dequeued. Layers show discovered words by their shortest distance from the start; blue words are queued and gray words have had successors examined. The manual chain and the BFS demonstration are independent. Each manual attempt is capped at 40 moves. No score is stored or transmitted.", ko: "화면에 제공한 유한 dictionary가 vertex 전체입니다. 모든 영어 단어를 대상으로 하지 않습니다. 길이가 같고 정확히 한 글자만 다른 두 word를 무방향 edge로 연결하며 edge 비용은 1입니다. 가능한 이웃을 눌러 chain을 만드세요. BFS는 이웃을 알파벳순으로 검사하고 queue에 넣을 때 discovered로 표시하며 꺼낼 때 goal인지 확인합니다. Layer는 시작점에서의 최단 거리에 따라 발견한 word를 묶습니다. 파랑은 queue에서 기다리는 word, 회색은 이웃을 검사한 word입니다. 수동 chain과 BFS 실행은 별개입니다. 수동 시도는 40번 이동까지 가능합니다. 점수는 저장하거나 전송하지 않습니다."}
search-bfs-jugs:
  bundle: search-unweighted
  stylesheet: /assets/css/search-unweighted.css
  title: {en: "Water-jug puzzle: measure exactly 4 liters", ko: "Water-jug puzzle: 정확히 4L 만들기"}
  note: {en: "A state (a,b) records integer liters in jugs A and B. Start (0,0); the goal is exactly the target amount in either jug. Six action types are allowed: fill either jug completely from an unlimited tap, empty either jug completely to a drain, or pour in either direction until the source empties or the destination fills. No intermediate stopping or scale marks may be used. Every nontrivial action costs 1, independent of liters moved; unchanged actions are omitted. BFS explores this finite directed state graph in the listed action order, discovers on enqueue and tests on dequeue. The 2L/4L target3L preset is deliberately unreachable. Manual play and the BFS trace are independent, and each manual attempt is capped at 40 actions. No state or score leaves the page.", ko: "State (a,b)는 A와 B에 든 정수 L의 물을 나타냅니다. (0,0)에서 시작해 어느 한 jug에 목표량을 정확히 담으면 성공입니다. 무한한 수도에서 한 jug를 가득 채우기, 배수구에 완전히 비우기, 한쪽이 비거나 다른 쪽이 찰 때까지 붓기라는 여섯 동작만 허용합니다. 붓다가 임의로 멈추거나 눈금으로 양을 재는 것은 허용하지 않습니다. State가 바뀌는 동작은 옮긴 양과 관계없이 비용이 1이며 그대로인 동작은 제외합니다. BFS는 이 유한 directed state graph를 화면의 동작 순서대로 검사하고 enqueue할 때 발견 표시, dequeue할 때 goal 검사를 합니다. 2L/4L로 3L를 만드는 preset에는 일부러 해가 없습니다. 수동 조작과 BFS trace는 별개이고 수동 시도는 40번 동작까지 가능합니다. State나 점수는 페이지 밖으로 보내지 않습니다."}
