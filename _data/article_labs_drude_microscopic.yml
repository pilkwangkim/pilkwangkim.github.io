drude-angle:
  bundle: drude-microscopic
  title: {en: "One deflection: event counting versus current relaxation", ko: "Scattering 각도에 따라 전류가 얼마나 줄어들까?"}
  note: {en: "Equal-speed 3D elastic model: one polar deflection angle with uniform azimuth, prescribed channel reference rate r=0.1–5 ps⁻¹. The current-carrying imbalance decays at Γtr=r(1−cosθ). The rate plot keeps θ=0–180° and Γtr=0–10.5 ps⁻¹ fixed; r changes its height and θ selects a point. The wavevector diagram has unit vectors and shows directions, not particle paths. At θ=0 the channel is the identity: Γtr=0 and τtr=∞; finite r is only a reference clock, not an out-scattering lifetime. At 180°, τtr=1/(2r). Electron energy is unchanged.", ko: "3D elastic 모델에서 scattering 각도 하나를 정하고 azimuth 방향에는 같은 확률을 줍니다. Speed는 일정하며 reference rate는 r=0.1–5 ps⁻¹입니다. 전류를 만드는 방향별 occupation 차이는 Γtr=r(1−cosθ)로 감소합니다. Rate 그래프는 θ=0–180°, Γtr=0–10.5 ps⁻¹로 축을 고정합니다. r을 바꾸면 곡선의 높이가 달라지고 θ를 바꾸면 선택한 점이 움직입니다. Unit-wavevector 그림은 방향만 보여주며 전자가 움직인 경로가 아닙니다. θ=0이면 Γtr=0, τtr=∞입니다. 이때 r은 비교용 reference일 뿐 실제 out-scattering lifetime이 아닙니다. θ=180°에서는 τtr=1/(2r)이며 전자의 에너지는 바뀌지 않습니다."}
drude-impurity:
  bundle: drude-microscopic
  title: {en: "Short-range scattering: count final states and square the amplitude", ko: "Short-range scattering: final-state 수와 amplitude의 제곱"}
  note: {en: "Fixed isotropic 3D parabolic mass m*=0.2m0. Spin-conserving Born scattering with constant Fourier amplitude U0. Γq=Γtr=(2π/ℏ)ni|U0|²D1(K)=ni v 4πaB²; D1 is per spin. Reference ni=10²⁵ m⁻³, K=50 meV, aB=0.2 nm and U0=2πℏ²aB/m*. K, ni and |U0| are independent model inputs. Both plots keep physical axes fixed: K=10–150 meV, Γ=0–12.5 ps⁻¹ and τ=0–32 ps. Dashed reference curves do not move. The unspecified defect range and potential strength must separately justify the Born approximation.", ko: "m*=0.2m0인 isotropic 3D parabolic band에서 spin-conserving Born scattering을 계산합니다. U0는 일정하며 Γq=Γtr=(2π/ℏ)ni|U0|²D1(K)=ni v 4πaB²입니다. D1은 one-spin DOS입니다. Reference는 ni=10²⁵ m⁻³, K=50 meV, aB=0.2 nm, U0=2πℏ²aB/m*입니다. K, ni, |U0|는 독립적인 입력입니다. 두 그래프의 축은 K=10–150 meV, Γ=0–12.5 ps⁻¹, τ=0–32 ps로 고정하며 점선 reference 곡선도 같은 자리에 남습니다. Defect의 range와 potential strength를 따로 확인해야 Born 근사의 타당성을 판단할 수 있습니다."}
drude-phonon:
  bundle: drude-microscopic
  title: {en: "Acoustic phonons: occupation, energy exchange and allowed transitions", ko: "Acoustic phonon: occupation과 energy·momentum 보존"}
  note: {en: "One longitudinal acoustic branch with ωq=v_s q, v_s=5000 m/s, and a 3D parabolic electron mass 0.2m0. The first plot has fixed axes T=5–600 K and log10(occupation factor)=−7–3; it shows Nq, Nq+1 and kBT/(ℏωq), not rates. The second keeps q=0.05–2 nm⁻¹ and final energy −7–108 meV fixed; K changes the candidate energies K±ℏv_s q. Red selected markers fail energy or momentum conservation. Normal-process tests require |cosα_abs|≤1 and |cosα_em|≤1 with cosα_abs=v_s/v−q/(2k), cosα_em=v_s/v+q/(2k), plus K≥ℏωq for emission. No Pauli blocking or reciprocal-lattice transfer.", ko: "Longitudinal acoustic branch 하나에 ωq=v_s q, v_s=5000 m/s를 쓰고 전자는 m*=0.2m0인 3D parabolic band로 계산합니다. 첫 그래프는 T=5–600 K, log10(occupation factor)=−7–3으로 축을 고정합니다. 완전한 rate가 아니라 Nq, Nq+1, kBT/(ℏωq)를 비교합니다. 두 번째는 q=0.05–2 nm⁻¹, final energy=−7–108 meV로 축을 고정하고 K±ℏv_s q를 그립니다. K를 바꾸면 energy 선들이 움직이며, 빨간 점은 energy 또는 momentum 보존 조건을 만족하지 못합니다. Normal process에서는 cosα_abs=v_s/v−q/(2k), cosα_em=v_s/v+q/(2k)에 대해 |cosα|≤1이 필요하고, emission에는 K≥ℏωq도 필요합니다. Pauli blocking과 reciprocal-lattice transfer는 포함하지 않습니다."}
drude-average:
  bundle: drude-microscopic
  title: {en: "Which average belongs in mobility?", ko: "Mobility에는 어떤 평균을 넣어야 할까?"}
  note: {en: "Nondegenerate Maxwell–Boltzmann gas in an isotropic 3D parabolic band, m*=0.2m0. τ(K)=τref(K/Kref)^r, Kref=50 meV, τref=0.670864 ps held fixed as T changes. For y=K/(kBT), normalized weights are y^(1/2)exp(−y)/Γ(3/2) and y^(3/2)exp(−y)/Γ(5/2). Dividing by kBT in meV gives probability density per meV. The physical weight axes stay K=0–400 meV and density=0–0.12 meV⁻¹; markers indicate mean energies. The time plot keeps T=50–600 K and log10(time/ps)=−2–3 fixed. Averages use full 0<K<∞ analytic integrals, not the display window. Conductivity averaging needs r>−5/2; particle averaging needs r>−3/2. Divergent particle curves are omitted.", ko: "m*=0.2m0인 isotropic 3D parabolic band와 nondegenerate Maxwell–Boltzmann gas를 가정합니다. τ(K)=τref(K/Kref)^r, Kref=50 meV, τref=0.670864 ps이며 온도를 바꿔도 τref는 고정합니다. y=K/(kBT)에서 두 weight는 y^(1/2)exp(−y)/Γ(3/2), y^(3/2)exp(−y)/Γ(5/2)입니다. Γ는 gamma function입니다. 각 weight를 meV 단위 kBT로 나눠 meV⁻¹ 단위의 확률밀도로 바꿉니다. 축은 K=0–400 meV, density=0–0.12 meV⁻¹로 고정하며 점은 평균 energy입니다. Time 그래프도 T=50–600 K, log10(time/ps)=−2–3으로 고정합니다. 평균은 표시 범위와 무관하게 0<K<∞ 전체 analytic integral로 계산합니다. Conductivity average에는 r>−5/2, particle average에는 r>−3/2가 필요하며, 발산하는 particle 곡선은 그리지 않습니다."}
