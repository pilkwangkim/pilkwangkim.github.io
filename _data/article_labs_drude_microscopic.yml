drude-angle:
  bundle: drude-microscopic
  title: {en: "One deflection: event counting versus current relaxation", ko: "Scattering 각도에 따라 전류가 얼마나 줄어들까?"}
  note: {en: "Equal-speed 3D elastic model: one polar deflection angle with uniform azimuth, prescribed channel reference rate r=0.1–5 ps⁻¹. The current-carrying imbalance decays at Γtr=r(1−cosθ). The rate plot keeps θ=0–180° and Γtr=0–10.5 ps⁻¹ fixed; r changes its height and θ selects a point. The wavevector diagram has unit vectors and shows directions, not particle paths. At θ=0 the channel is the identity: Γtr=0 and τtr=∞; finite r is only a reference clock, not an out-scattering lifetime. At 180°, τtr=1/(2r). Electron energy is unchanged.", ko: "3D elastic 모델에서 scattering 각도 하나를 정하고 azimuth 방향에는 같은 확률을 줍니다. Speed는 일정하며 reference rate는 r=0.1–5 ps⁻¹입니다. 전류를 만드는 방향별 occupation 차이는 Γtr=r(1−cosθ)로 감소합니다. Rate 그래프는 θ=0–180°, Γtr=0–10.5 ps⁻¹로 축을 고정합니다. r을 바꾸면 곡선의 높이가 달라지고 θ를 바꾸면 선택한 점이 움직입니다. Unit-wavevector 그림은 방향만 보여주며 전자가 움직인 경로가 아닙니다. θ=0이면 Γtr=0, τtr=∞입니다. 이때 r은 비교용 reference일 뿐 실제 out-scattering lifetime이 아닙니다. θ=180°에서는 τtr=1/(2r)이며 전자의 에너지는 바뀌지 않습니다."}
drude-impurity:
  bundle: drude-microscopic
  title: {en: "Short-range scattering: more often per second, not per meter", ko: "Short-range scattering: 전자가 빨라지면 더 자주 부딪힐까?"}
  note: {en: "Raise the electron energy first, then change the impurity density or Fourier amplitude. The fixed-energy rate and transport mean free path do not respond in the same way. Dashed lines show the Section 15 reference; the path axis is logarithmic to span all inputs.", ko: "먼저 전자의 에너지를 높여 보고, 그다음 impurity density나 Fourier amplitude를 바꿔 보세요. Scattering rate와 transport mean free path가 똑같이 변하지는 않습니다. 점선은 15절의 기준값입니다. 아래 그래프의 세로축은 넓은 범위를 비교할 수 있도록 log scale을 씁니다."}
drude-phonon:
  bundle: drude-microscopic
  title: {en: "Acoustic phonons: occupation, energy exchange and allowed transitions", ko: "Acoustic phonon: occupation과 energy·momentum 보존"}
  note: {en: "The upper plot compares occupation factors, not rates. Below it, dashed lines show candidate final energies, and solid segments show the wavevectors that can also satisfy momentum conservation. Change the electron energy to move those boundaries.", ko: "위쪽 그래프는 rate가 아니라 occupation factor를 비교합니다. 아래쪽 점선은 에너지 보존식에서 구한 전자의 에너지이고, 실선은 운동량까지 보존할 수 있는 구간입니다. 전자의 에너지를 바꾸면 이 구간이 얼마나 달라지는지 볼 수 있습니다."}
drude-average:
  bundle: drude-microscopic
  title: {en: "Which average belongs in mobility?", ko: "Mobility에는 어떤 평균을 넣어야 할까?"}
  note: {en: "The upper plot shows the energy weights. The lower plot shows how much of each full average comes from energies below the chosen point on the horizontal axis. Try increasing the exponent of τ(K) without changing the temperature.", ko: "위쪽 그래프는 에너지별 weight를 보여줍니다. 아래쪽에서는 가로축의 에너지보다 낮은 구간이 각 평균에서 차지하는 비율을 읽을 수 있습니다. 온도를 고정하고 τ(K)의 exponent만 높여 보세요."}
