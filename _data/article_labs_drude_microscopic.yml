drude-angle:
  bundle: drude-microscopic
  title: {en: "One deflection: event counting versus current relaxation", ko: "Scattering 각도에 따라 전류가 얼마나 줄어들까?"}
  note: {en: "Equal-speed 3D elastic model: one polar deflection angle with uniform azimuth, prescribed channel reference rate r=0.1–5 ps⁻¹. The velocity-weighted occupation imbalance that carries current decays at Γtr=r(1−cosθ). Wavevector arrows are not particle paths. At θ=0 the channel is the identity: Γtr=0 and τtr=∞; finite r there is only a reference clock, not an out-scattering lifetime. At 180°, τtr=1/(2r). Electron energy is unchanged.", ko: "3D elastic 모델에서 scattering 각도 하나를 정하고 azimuth 방향에는 같은 확률을 줍니다. Speed는 일정하며 channel reference rate는 r=0.1–5 ps⁻¹입니다. 전류를 만드는 방향별 occupation 차이는 Γtr=r(1−cosθ)로 감소합니다. Wavevector 화살표는 전자가 움직인 경로가 아닙니다. θ=0이면 방향이 바뀌지 않아 Γtr=0, τtr=∞입니다. 이때 유한한 r은 비교용 reference일 뿐 실제 out-scattering lifetime이 아닙니다. θ=180°에서는 τtr=1/(2r)이며, 전자의 에너지는 바뀌지 않습니다."}
drude-impurity:
  bundle: drude-microscopic
  title: {en: "Short-range scattering: count final states and square the amplitude", ko: "Short-range scattering: final-state 수와 amplitude의 제곱"}
  note: {en: "Fixed isotropic 3D parabolic mass m*=0.2m0. Spin-conserving Born scattering with constant Fourier amplitude U0. Γq=Γtr=(2π/ℏ)ni|U0|²D1(K)=ni v 4πaB²; D1 is per spin. Reference ni=10²⁵ m⁻³, K=50 meV, aB=0.2 nm and U0=2πℏ²aB/m*. User changes K, ni and |U0| independently as model inputs. The defect range and microscopic potential strength are not specified, so large kℓ alone does not establish Born validity.", ko: "m*=0.2m0인 isotropic 3D parabolic band에서 spin-conserving Born scattering을 계산합니다. Fourier amplitude U0는 일정하며 Γq=Γtr=(2π/ℏ)ni|U0|²D1(K)=ni v 4πaB²입니다. D1은 one-spin DOS입니다. Reference는 ni=10²⁵ m⁻³, K=50 meV, aB=0.2 nm이고 U0=2πℏ²aB/m*입니다. K, ni, |U0|는 모델의 독립적인 입력으로 바꿉니다. Defect의 range와 microscopic potential strength는 정하지 않았으므로, kℓ이 크다는 사실만으로 Born 근사가 성립한다고 할 수는 없습니다."}
drude-phonon:
  bundle: drude-microscopic
  title: {en: "Acoustic phonons: occupation, energy exchange and allowed transitions", ko: "Acoustic phonon: occupation과 energy·momentum 보존"}
  note: {en: "One longitudinal acoustic branch with ωq=v_s q, v_s=5000 m/s, and a 3D parabolic electron mass 0.2m0. Bose factors Nq and Nq+1 are plotted, not complete rates. Fixed-q normal-process kinematics uses cosα_abs=v_s/v−q/(2k) and cosα_em=v_s/v+q/(2k); |cosα|≤1 is required, with K≥ℏωq for emission. High phonon occupation and quasielastic electronic scattering are separate approximations. No Pauli blocking, reciprocal-lattice transfer or classical-displacement expectation is calculated.", ko: "Longitudinal acoustic branch 하나에 ωq=v_s q, v_s=5000 m/s를 쓰고, 전자는 m*=0.2m0인 3D parabolic band로 계산합니다. 그래프는 완전한 rate가 아니라 Bose factor Nq, Nq+1입니다. 고정한 q의 normal process에서 cosα_abs=v_s/v−q/(2k), cosα_em=v_s/v+q/(2k)이며 |cosα|≤1이 필요합니다. Emission에는 K≥ℏωq도 필요합니다. High phonon occupation과 quasielastic scattering은 별개의 근사입니다. Pauli blocking, reciprocal-lattice transfer, 원자의 classical displacement expectation은 계산하지 않습니다."}
drude-average:
  bundle: drude-microscopic
  title: {en: "Which average belongs in mobility?", ko: "Mobility에는 어떤 평균을 넣어야 할까?"}
  note: {en: "Nondegenerate Maxwell–Boltzmann gas in an isotropic 3D parabolic band, m*=0.2m0. τ(K)=τref(K/Kref)^r, Kref=50 meV, τref=0.670864 ps from the short-range model; τref is held fixed as temperature changes. For y=K/(kBT), the normalized particle and conductivity weights are y^(1/2)exp(−y)/Γ(3/2) and y^(3/2)exp(−y)/Γ(5/2). Γ is the gamma function. Full analytic averages use 0<K<∞; the displayed weight window ends at y=8. Conductivity averaging needs r>−5/2; particle averaging needs r>−3/2. Divergent particle averages are stated, not plotted as finite values.", ko: "m*=0.2m0인 isotropic 3D parabolic band와 nondegenerate Maxwell–Boltzmann gas를 가정합니다. τ(K)=τref(K/Kref)^r이며 Kref=50 meV, τref=0.670864 ps는 short-range 모델의 값입니다. 온도를 바꿔도 τref는 고정합니다. y=K/(kBT)일 때 normalized particle weight는 y^(1/2)exp(−y)/Γ(3/2), conductivity weight는 y^(3/2)exp(−y)/Γ(5/2)이며, Γ는 gamma function입니다. 평균은 0<K<∞ 전체 구간의 analytic integral로 계산하고, weight 그래프만 y=8까지 표시합니다. Conductivity average에는 r>−5/2, particle average에는 r>−3/2가 필요합니다. 발산하는 particle average를 유한한 값처럼 표시하지 않습니다."}
