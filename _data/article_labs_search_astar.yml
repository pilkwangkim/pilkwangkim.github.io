search-astar-tiles:
  bundle: search-astar
  stylesheet: /assets/css/search-astar.css
  title: {en: "The 8-puzzle: play first, then race A*", ko: "8-puzzle: 직접 풀고 A*와 비교하기"}
  note: {en: "A state is a row-major permutation of tiles 1–8 and blank 0. A legal move swaps the blank with an orthogonally adjacent tile and costs 1. Goal: 123456780. Presets have exact optimal distances 4, 8 and 12, verified by reverse BFS—not by counting scramble moves. Manhattan h sums numbered-tile distances and excludes the blank. The h=0 setting is Dijkstra. Ties use lower h, then insertion order; neighbor order moves the blank right/down/left/up. Goal acceptance is on a valid minimum-priority pop. Expanded excludes the goal. The solver rejects stale entries and reopens on strict g improvements; a run stops after at most 50,000 valid pops. Finish runs in scheduled batches. Manual play and solver playback are separate. All state stays in the browser; no score is stored or sent.", ko: "State는 tile 1–8과 빈칸 0을 행 순서로 나열한 것입니다. 빈칸과 상하좌우로 붙은 tile을 바꾸며 한 번의 비용은 1입니다. Goal은 123456780입니다. 예제의 최적 이동 수 4·8·12는 reverse BFS로 확인한 값이며, 섞은 횟수가 아닙니다. Manhattan h는 숫자 tile의 거리만 합하고 빈칸은 제외합니다. h=0을 고르면 Dijkstra가 됩니다. Priority가 같으면 h가 작은 쪽, 그다음 먼저 넣은 쪽을 선택합니다. 빈칸의 이웃 순서는 오른쪽·아래·왼쪽·위입니다. 유효한 최소 priority entry로 goal을 꺼낼 때 종료하며 Expanded에 goal은 포함하지 않습니다. 오래된 entry를 버리고 g가 줄면 reopening합니다. 한 번의 탐색은 유효 pop 50,000번으로 제한하며, 끝까지 계산은 여러 batch로 나누어 실행합니다. 직접 조작하는 board와 solver 재생 board는 별개입니다. 계산은 브라우저 안에서만 이루어지며 점수는 저장하거나 전송하지 않습니다."}
search-astar-detective:
  bundle: search-astar
  stylesheet: /assets/css/search-astar.css
  title: {en: "Heuristic detective: catch the wrong answer", ko: "Heuristic 탐정: 잘못된 답이 나오는 순간 찾기"}
  note: {en: "Finite directed graph: S→A=3, S→B=1, B→A=1, A→G=3, B→G=100. The exact remaining costs h* are (5,3,4,0) in S,A,B,G order; the optimum is S→B→A→G, cost 5. Presets: zero=(0,0,0,0), exact=(5,3,4,0), admissible but inconsistent=(5,0,4,0), overestimated=(0,0,8,0). Priorities are g+h, ties use lower h then insertion order, and the goal is accepted when popped. With reopening off, improvements to already expanded states are deliberately discarded: this is an incorrect general-A* variant used to expose the failure. With the inconsistent preset it returns cost 6; reopening restores cost 5. An overestimated h can return cost 6 even with reopening. Expanded excludes the goal. No result is stored or transmitted.", ko: "유한한 directed graph의 edge는 S→A=3, S→B=1, B→A=1, A→G=3, B→G=100입니다. S,A,B,G 순서의 정확한 남은 비용 h*는 (5,3,4,0)이며 최적 경로는 S→B→A→G, 비용은 5입니다. 예제 h는 zero=(0,0,0,0), exact=(5,3,4,0), admissible하지만 inconsistent한 값=(5,0,4,0), 과대평가한 값=(0,0,8,0)입니다. Priority는 g+h이고 동점이면 h가 작은 쪽, 그다음 먼저 넣은 쪽을 선택합니다. Goal을 꺼낼 때 종료합니다. Reopening을 끄면 이미 확장한 state의 g 개선을 일부러 버립니다. 일반적인 A*에서 잘못된 답이 나올 수 있는 구현을 시험하는 옵션입니다. Inconsistent 예제에서는 비용 6을 반환하지만 reopening을 켜면 5를 얻습니다. h를 과대평가하면 reopening을 켜도 6이 나올 수 있습니다. Expanded에 goal은 포함하지 않습니다. 결과는 저장하거나 전송하지 않습니다."}
