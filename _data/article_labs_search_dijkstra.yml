search-dijkstra-delivery:
  bundle: search-dijkstra
  stylesheet: /assets/css/search-dijkstra.css
  title: {en: "Delivery challenge: few roads or few minutes?", ko: "배달 미션: 적은 도로, 짧은 시간?"}
  note: {en: "Eight authored stops, eleven positive undirected roads. Labels are fixed minutes, not geometric distance. Deliver A→H by clicking connected stops. Normal: direct A–H=18; A–B–C–H=12; A–D–E–F–G–H=10. Traffic multiplies A–D, D–E, E–F, F–G and G–H by 3; other presets close E–F or all H roads. Changes restart the search. One Step removes one raw priority-queue entry; an obsolete entry is discarded without relaxation. Valid pops settle a stop, then examine all its neighbors. Delivery ends on a valid minimum-g goal pop, not discovery. Ties use source ID, stop ID, then insertion order. Manual routes may revisit stops; only open connected roads are legal. No score is saved.", ko: "Stop 8개와 양수 비용의 양방향 도로 11개로 만든 예제입니다. 숫자는 고정된 이동 시간(분)이며 그림의 길이와 무관합니다. 연결된 stop을 클릭해 A→H 배달 경로를 만드세요. 평소에는 A–H=18분, A–B–C–H=12분, A–D–E–F–G–H=10분입니다. 교통량 예제는 A–D·D–E·E–F·F–G·G–H 시간을 3배로 늘립니다. 다른 예제는 E–F 또는 H로 들어가는 모든 도로를 닫습니다. 조건을 바꾸면 탐색을 다시 시작합니다. 한 단계마다 raw priority-queue entry 하나를 꺼냅니다. 오래된 entry는 relaxation 없이 버리고, 유효한 entry는 settled로 표시한 뒤 모든 이웃을 검사합니다. Goal을 발견했을 때가 아니라 유효한 최소 g로 꺼냈을 때 끝냅니다. 동점은 source ID·stop ID·삽입 순서로 처리합니다. 직접 만든 경로는 같은 stop을 다시 지나도 되지만 열린 도로로 연결되어야 합니다. 점수는 저장하지 않습니다."}
search-dijkstra-dispatch:
  bundle: search-dijkstra
  stylesheet: /assets/css/search-dijkstra.css
  title: {en: "Dispatch desk: two stations, one shared frontier", ko: "출동 미션: 두 station이 frontier 하나를 공유한다면"}
  note: {en: "The same eight-stop positive undirected network, with two distinct stations initialized at g=0 in one priority queue. Dijkstra runs until the queue is exhausted, finding min(dist(station1,v),dist(station2,v)) at every reachable v. Both stations start immediately; no capacity, congestion caused by vehicles, service duration or waiting-time model is included. On equal arrival time the alphabetically earlier source wins; a queue entry is stale if either its distance or owner is obsolete. Coloring before settlement is tentative; a square ring marks a station and a solid circle outline marks settled stops. Select any emergency stop, or move either station. Presets include A+H, A+G (a four-minute tie at E), and B+F. Changing stations or road conditions restarts both wavefronts.", ko: "같은 양수 비용의 양방향 network에서 서로 다른 station 두 곳을 g=0으로 priority queue 하나에 넣습니다. Queue를 모두 확인해 도달 가능한 각 v에서 min(dist(station1,v),dist(station2,v))를 구합니다. 두 station은 즉시 출발하며 차량 수용량·차량이 만드는 혼잡·현장 처리 시간·대기 시간은 모형에 없습니다. 도착 시간이 같으면 알파벳이 앞선 source를 선택합니다. 거리나 담당 source가 바뀐 entry는 오래된 entry로 버립니다. Settled 전의 색은 잠정 배정입니다. 사각 테두리는 station, 실선 원 테두리는 settled인 stop입니다. 긴급 출동할 stop을 선택하거나 station을 옮겨 보세요. A+H·A+G(E에서 4분 동점)·B+F 예제가 있습니다. Station이나 도로 조건을 바꾸면 두 wavefront를 처음부터 다시 계산합니다."}
