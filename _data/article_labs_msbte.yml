msbte-basics:
  bundle: msbte
  stylesheet: /assets/css/article-labs-msbte.css
  title: {en: "Boltzmann basics: transport and relaxation separately", ko: "Boltzmann equation: 이동과 relaxation을 따로 보기"}
  note: {en: "Two distinct analytical initial-value problems, not combined dynamics. Collisionless mode solves partial_t f+v partial_x f=0 with fixed v=20 nm/ps and occupation f(x,t)=0.1+0.8 exp[-(x-20t+30)^2/(2*12^2)]; x is displayed from -100 to 140 nm and t ranges from 0 to 4 ps. The occupation profile is not a single-electron wavefunction or a probability density normalized to one; the plotted endpoints are a viewing window, not contacts. Relaxation mode is spatially uniform with no streaming gradient. Two equal-speed, opposite-direction branches at one energy have reciprocal unblocked elastic reversal coefficient r=0–1 ps⁻¹: df⁺/dt = r(f⁻−f⁺), df⁻/dt = −df⁺/dt. The initial occupations are 0.8 and 0.2; f±(t)=0.5±0.3exp(-2rt), so the sum stays 1. This r has inverse-time units, unlike the later inverse-length beta. The formulas are exact within these stated reductions, not a full device calculation. BTE framework: Noei et al. (2020), DOI 10.1007/s10825-020-01488-4; no user-supplied code is executed.", ko: "이동만 계산하는 예제와 relaxation만 계산하는 예제입니다. 두 예제 모두 초기 occupation을 정하고 시간에 따른 변화를 구하는 initial-value problem입니다. Collision이 없는 모드에서는 v=20 nm/ps로 고정하고 partial_t f+v partial_x f=0을 풉니다. 해는 f(x,t)=0.1+0.8 exp[-(x-20t+30)^2/(2*12^2)]이며, x는 -100부터 140 nm, t는 0부터 4 ps까지 표시합니다. Occupation profile은 전자 하나의 wavefunction이나 적분하면 1이 되는 probability density가 아닙니다. 그래프 양 끝은 표시 범위의 경계이며, contact가 아닙니다. Relaxation 모드에서는 occupation이 공간상 균일해서 streaming gradient가 없습니다. 두 branch의 에너지는 같고, 속력도 같으며 방향만 반대입니다. Pauli blocking을 적용하기 전의 elastic reversal 계수를 두 방향 모두 r=0–1 ps⁻¹로 둡니다. df⁺/dt = r(f⁻−f⁺), df⁻/dt = −df⁺/dt이고 초기 occupation은 0.8과 0.2입니다. 해는 f±(t)=0.5±0.3exp(-2rt)이며, 두 occupation의 합은 1로 유지됩니다. r은 inverse-time rate이며, 뒤에서 사용하는 inverse-length 계수 beta와 다릅니다. 위 조건에서는 수식을 정확히 풀 수 있지만, 이 모델로 소자 전체를 계산하는 것은 아닙니다. BTE 참고: Noei et al. (2020), DOI 10.1007/s10825-020-01488-4. 사용자가 입력한 코드는 실행하지 않습니다."}
msbte-confinement:
  bundle: msbte
  stylesheet: /assets/css/article-labs-msbte.css
  title: {en: "Confinement: width changes the available subbands", ko: "Confinement: wire의 폭을 바꾸면 subband는 어떻게 바뀔까?"}
  note: {en: "Rectangular infinite-barrier wire with width W=6–20 nm and fixed height H=8 nm; isotropic illustrative effective mass 0.19 m0, one valley. Transverse modes (ny,nz) are re-sorted by their exact hard-wall eigenenergies. Dispersion is E=epsilon+hbar²k²/(2m*). The probability curve is the y marginal, integrated over z, with unit area. No electrostatic self-consistency or material calibration is assumed.", ko: "W=6–20 nm, H=8 nm인 rectangular infinite-barrier wire입니다. Effective mass는 방향에 관계없이 0.19 m0, valley는 하나로 둔 예제입니다. 각 (ny,nz) mode를 hard-wall eigenenergy가 낮은 순서로 정렬합니다. Dispersion은 E=epsilon+hbar²k²/(2m*)입니다. 곡선은 z에 대해 적분한 y 방향 marginal probability density이며, 곡선 아래 면적은 1입니다. Electrostatic self-consistency는 포함하지 않았으며, parameter를 실제 재료에 맞춰 보정하지 않았습니다."}
msbte-injection:
  bundle: msbte
  stylesheet: /assets/css/article-labs-msbte.css
  title: {en: "Ballistic injection: two reservoirs, two directions", ko: "Ballistic injection: 양쪽 contact에서 들어오는 전자"}
  note: {en: "Uniform W=10 nm, H=8 nm hard-wall wire, m*=0.19 m0, spin degeneracy 2, one valley, unit transmission and no scattering. Each reservoir supplies only its incoming states. The plot displays the first two subbands; the charge-current sum includes 2, 4, or 8 modes and integrates the Fermi functions to infinite energy analytically. Negative conventional current means electron flow toward +x. Chemical-potential differences are prescribed contact conditions, not a self-consistent voltage profile.", ko: "W=10 nm, H=8 nm, m*=0.19m0인 균일한 hard-wall wire입니다. Spin degeneracy는 2, valley는 하나이며 transmission은 1이고 scattering은 없습니다. 각 reservoir는 소자로 들어오는 state만 채웁니다. 그래프는 첫 두 subband만 보여 줍니다. 전류는 선택한 2·4·8개 mode를 모두 합해 구합니다. Fermi function의 에너지 적분은 무한대까지 해석적으로 계산합니다. Conventional current가 음수이면 전자는 +x로 흐릅니다. Chemical potential 차이는 contact 조건으로 지정했으며 self-consistent voltage profile을 계산한 것은 아닙니다."}
msbte-scattering:
  bundle: msbte
  stylesheet: /assets/css/article-labs-msbte.css
  title: {en: "Elastic MS-BTE: how scattering changes the distribution", ko: "Elastic MS-BTE: scattering으로 바뀌는 distribution"}
  note: {en: "One total-energy shell in a uniform 100 nm wire. Only open states among the first two W=10 nm, H=8 nm, m*=0.19 m0 subbands are retained; E <= 140 meV keeps the third closed. Symmetric inverse-length coefficients kappa_ab are beta for intraband opposite directions and gamma/2 for every inter-subband directional pair. C_a=v_a sum_b kappa_ab(f_b-f_a), so density weights proportional to 1/v_a ensure particle conservation and symmetric elastic Pauli factors cancel. A bounded first-order upwind finite-volume linear solve fixes incoming fL/fR only. The optional prescribed nonthermal mode-selective left injector sets mode 2's incoming occupation independently, not through an equilibrium reservoir. Its default 0.3 is below mode 1's 0.9, but it may also be raised above mode 1. Conservative total flux is computed at cell faces; individual subband fluxes may vary. Occupations and face flux have finite-grid error; increasing N tests convergence. These are chosen elastic rates, not calibrated device parameters. The grid-error diagnostic applies to equal per-mode inflows (including one open mode). For M open modes, alpha=beta+(M-1)gamma/2, T_cont=1/(1+alpha L), T_FV=(1+alpha dx)/(1+alpha L+alpha dx), and the percentage is 100(T_FV/T_cont-1). It compares transmission even when the contact current is zero. For unequal mode inflows the metric is not applicable; refine N and compare profiles and flux.", ko: "길이 100 nm인 균일한 wire에서 총에너지 하나를 고정합니다. W=10 nm, H=8 nm, m*=0.19m0인 첫 두 subband에서, 주어진 에너지로 전자가 진행할 수 있는 state만 포함합니다. E<=140 meV이므로 세 번째 subband에는 이 에너지로 진행할 수 있는 state가 없습니다. 대칭인 inverse-length 계수 kappa_ab를 같은 subband의 반대 방향에는 beta, 다른 subband의 모든 방향 쌍에는 gamma/2로 둡니다. C_a=v_a sum_b kappa_ab(f_b-f_a)이며 density weight가 1/v_a에 비례하므로 입자 수가 보존됩니다. 대칭인 elastic transition에서는 Pauli factor가 서로 상쇄됩니다. Boundary에서는 들어오는 fL/fR만 지정하고, 내부 occupation은 first-order upwind finite-volume 방식으로 구합니다. Mode별 주입을 켜면 왼쪽에서 mode 2의 occupation을 독립적으로 지정합니다. 기본값 0.3은 mode 1의 0.9보다 작지만 첫 번째 mode의 occupation보다 크게 지정해도 됩니다. 이 옵션에서는 equilibrium reservoir 대신 nonthermal mode-selective injector의 주입 조건을 직접 지정합니다. 전체 flux는 cell face에서 보존되지만 subband별 flux는 달라질 수 있습니다. 결과에는 grid 오차가 있으므로 N을 늘려 수렴을 확인해야 합니다. 실제 소자에 맞춘 parameter는 아닙니다. Transmission의 grid 오차는 각 contact에서 mode별 inflow가 같을 때 계산합니다. 이 에너지에서 전자가 진행할 수 있는 mode가 하나인 경우도 포함합니다. 진행 가능한 mode 수를 M이라고 하면 alpha=beta+(M-1)gamma/2, T_cont=1/(1+alpha L), T_FV=(1+alpha dx)/(1+alpha L+alpha dx)이고 백분율은 100(T_FV/T_cont-1)입니다. Contact 전류가 0이어도 transmission의 오차는 계산할 수 있습니다. 같은 contact에서 mode별 inflow가 서로 다르면 이 기준값을 사용할 수 없습니다. 이때는 N을 늘려 profile과 flux가 얼마나 달라지는지 비교해야 합니다."}
msbte-quiz:
  bundle: msbte
  stylesheet: /assets/css/article-labs-msbte.css
  title: {en: "Check the physics: energy, occupation and contacts", ko: "개념 확인: 에너지, occupation, contact 조건"}
  note: {en: "Four deterministic conceptual questions use explicit subband edges of 50 and 110 meV and total energies 90 or 130 meV. These rounded schematic values are not the exact geometry eigenenergies used by the other labs. Questions cover elastic energy conservation, open modes, equal-occupation equilibrium and incoming-only reservoir boundaries. Answers stay in the browser. No user-supplied code is executed.", ko: "네 문제에서 subband edge를 50·110 meV, 총에너지를 90 또는 130 meV로 지정합니다. 이해를 돕기 위해 반올림한 값이며, 다른 실습에서 사용하는 단면의 정확한 eigenenergy는 아닙니다. Elastic energy conservation, 에너지에 따른 진행 state의 유무, equilibrium에서의 occupation, 소자로 들어오는 방향에만 값을 지정하는 reservoir boundary를 확인합니다. 답은 브라우저 안에서만 처리하며, 사용자가 입력한 코드를 실행하지 않습니다."}
