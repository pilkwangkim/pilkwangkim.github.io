msbte-basics:
  bundle: msbte
  stylesheet: /assets/css/article-labs-msbte.css
  title: {en: "Boltzmann basics: transport and relaxation separately", ko: "Boltzmann equation: 이동과 relaxation을 따로 보기"}
  note: {en: "Two distinct analytical initial-value problems, not combined dynamics. Collisionless mode solves partial_t f+v partial_x f=0 with fixed v=20 nm/ps and occupation f(x,t)=0.1+0.8 exp[-(x-20t+30)^2/(2*12^2)]; x is displayed from -100 to 140 nm and t ranges from 0 to 4 ps. The occupation profile is not a single-electron wavefunction or a probability density normalized to one; the plotted endpoints are a viewing window, not contacts. Relaxation mode is spatially uniform with no streaming gradient. Two equal-speed, opposite-direction branches at one energy have reciprocal unblocked elastic reversal coefficient r=0–1 ps⁻¹: df⁺/dt = r(f⁻−f⁺), df⁻/dt = −df⁺/dt. The initial occupations are 0.8 and 0.2; f±(t)=0.5±0.3exp(-2rt), so the sum stays 1. This r has inverse-time units, unlike the later inverse-length beta. The formulas are exact within these stated reductions, not a full device calculation. BTE framework: Noei et al. (2020), DOI 10.1007/s10825-020-01488-4; no user-supplied code is executed.", ko: "이동만 계산하는 예제와 relaxation만 계산하는 예제입니다. 두 예제 모두 초기 occupation을 정하고 시간에 따른 변화를 구하는 initial-value problem입니다. Collision이 없는 모드에서는 v=20 nm/ps로 고정하고 partial_t f+v partial_x f=0을 풉니다. 해는 f(x,t)=0.1+0.8 exp[-(x-20t+30)^2/(2*12^2)]이며, x는 -100부터 140 nm, t는 0부터 4 ps까지 표시합니다. Occupation profile은 전자 하나의 wavefunction이나 적분하면 1이 되는 probability density가 아닙니다. 그래프 양 끝은 표시 범위의 경계이며, contact가 아닙니다. Relaxation 모드에서는 각 branch의 occupation이 위치에 따라 변하지 않으므로 공간 미분 항은 0입니다. 두 branch는 에너지와 speed가 같고 진행 방향만 반대입니다. Pauli blocking을 적용하기 전의 elastic reversal 계수를 두 방향 모두 r=0–1 ps⁻¹로 둡니다. df⁺/dt = r(f⁻−f⁺), df⁻/dt = −df⁺/dt이고 초기 occupation은 0.8과 0.2입니다. 해는 f±(t)=0.5±0.3exp(-2rt)이며, 두 occupation의 합은 1로 유지됩니다. r은 inverse-time rate이며, 뒤에서 사용하는 inverse-length 계수 beta와 다릅니다. 위 조건에서는 수식을 정확히 풀 수 있지만, 이 모델로 소자 전체를 계산하는 것은 아닙니다. BTE 참고: Noei et al. (2020), DOI 10.1007/s10825-020-01488-4. 사용자가 입력한 코드는 실행하지 않습니다."}
msbte-confinement:
  bundle: msbte
  stylesheet: /assets/css/article-labs-msbte.css
  title: {en: "Confinement: width changes the available subbands", ko: "Confinement: wire의 폭을 바꾸면 subband는 어떻게 바뀔까?"}
  note: {en: "Rectangular infinite-barrier wire with width W=6–20 nm and fixed height H=8 nm; isotropic illustrative effective mass 0.19 m0, one valley. Transverse modes (ny,nz) are re-sorted by their exact hard-wall eigenenergies. Dispersion is E=epsilon+hbar²k²/(2m*). The selected mode has separate y and z marginal densities, each of unit area; this distinguishes modes sharing one transverse index and energy-degenerate pairs. Physical axes stay fixed: k in [-0.5,0.5] nm⁻¹, E in [0,320] meV, y in [0,20] nm, z in [0,8] nm and density in [0,0.36] nm⁻¹. The y marginal is zero beyond the moving hard wall at y=W. No electrostatic self-consistency or material calibration is assumed.", ko: "W=6–20 nm, H=8 nm인 rectangular infinite-barrier wire입니다. Effective mass는 방향에 관계없이 0.19 m0, valley는 하나로 둔 예제입니다. 각 (ny,nz) mode를 hard-wall eigenenergy가 낮은 순서로 정렬합니다. Dispersion은 E=epsilon+hbar²k²/(2m*)입니다. 선택한 mode의 y·z marginal probability density를 따로 표시하며, 각각 적분하면 1입니다. 두 mode에서 한 방향의 index나 energy가 같더라도 y·z 방향 분포를 함께 비교하면 구별할 수 있습니다. k 축은 ±0.5 nm⁻¹, E 축은 0–320 meV, y는 0–20 nm, z는 0–8 nm, density는 0–0.36 nm⁻¹로 고정합니다. 지정한 경계 y=W 바깥에서는 y 방향 probability density가 0입니다. Electrostatic self-consistency는 포함하지 않았으며, parameter를 실제 재료에 맞춰 보정하지 않았습니다."}
msbte-injection:
  bundle: msbte
  stylesheet: /assets/css/article-labs-msbte.css
  title: {en: "Ballistic injection: two reservoirs, two directions", ko: "Ballistic injection: 양쪽 contact에서 들어오는 전자"}
  note:
    en: >-
      Uniform W=10 nm, H=8 nm hard-wall wire, m*=0.19 m0, spin degeneracy 2,
      one valley, unit transmission and no scattering. Only incoming states
      are prescribed. Chemical potentials range from 50 to 300 meV; all plot
      bounds stay fixed: k ±1.3 nm⁻¹, occupation 0–1, spectral current ±0.65
      μA/meV over E=20–480 meV, and cumulative current ±70 μA. The first plot
      shows the first two subbands. The spectral current is
      dIe/dE=(G0/1000)M(E)[fL−fR], with G0=2e²/h=77.4809 μA/V;
      M counts retained subbands below E;
      its signed energy area is Ie. Compare the selected 2-, 4-, or 8-mode
      spectrum against the eight-mode reference at identical contacts.
      Populate higher modes sets μL=300 meV, μR=80 meV and T=100 K, making
      the current lost by omitting modes visible. Equal reservoirs cancels
      current but not occupation; reversing contacts reverses its sign.
      Eight modes are a comparison cutoff, not a guaranteed converged wire.
      The readout integrates to infinite energy analytically, not just over
      the displayed window. Negative conventional current means electron
      flow toward +x. Contact energies are prescribed, not self-consistent.
    ko: >-
      W=10 nm, H=8 nm, m*=0.19m0인 균일한 hard-wall wire입니다. Spin
      degeneracy는 2, valley는 하나이며 transmission은 1이고 scattering은
      없습니다. 각 contact에서 들어오는 occupation만 지정합니다. Chemical
      potential은 50–300 meV이며 모든 그래프의 축 범위를 고정합니다. k는
      ±1.3 nm⁻¹, occupation은 0–1, spectral current는 E=20–480 meV에서
      ±0.65 μA/meV, 누적 전류는 ±70 μA입니다. 첫 그래프는 첫 두 subband를
      보여 줍니다. G0=2e²/h=77.4809 μA/V로 두면 에너지별 전류는
      dIe/dE=(G0/1000)M(E)[fL−fR]입니다. M은
      계산에 포함한 subband 중 edge가 E보다 낮은 것의 수입니다. 부호를
      반영해 적분한 면적이 Ie입니다. 같은 contact 조건에서 2·4·8개 mode를
      포함한 spectrum과 8-mode 기준을 비교합니다. 높은 mode까지 채우기는
      μL=300 meV, μR=80 meV, T=100 K로 설정하여 mode를 제외했을 때 빠지는
      전류를 보여 줍니다. 두 reservoir가 같으면 occupation은 남지만 전류는
      0입니다. Contact를 바꾸면 전류의 부호가 반대가 됩니다. 여덟 개는
      비교용 cutoff이며 전체 wire의 전류가 수렴했다는 뜻은 아닙니다. 전류
      표시값은 화면의 energy 범위만이 아니라 무한대까지 해석적으로 적분한
      결과입니다. Conventional current가 음수이면 전자는 +x로 흐릅니다.
      Contact energy는 지정한 값이며 self-consistent하게 계산하지 않습니다.
msbte-scattering:
  bundle: msbte
  stylesheet: /assets/css/article-labs-msbte.css
  title: {en: "Elastic MS-BTE: how scattering changes the distribution", ko: "Elastic MS-BTE: scattering으로 바뀌는 distribution"}
  note: {en: "One total-energy shell in a uniform 100 nm wire. Only open states among the first two W=10 nm, H=8 nm, m*=0.19 m0 subbands are retained; E <= 140 meV keeps the third closed. Symmetric inverse-length coefficients kappa_ab are beta for intraband opposite directions and gamma/2 for every inter-subband directional pair. C_a=v_a sum_b kappa_ab(f_b-f_a), so density weights proportional to 1/v_a ensure particle conservation and symmetric elastic Pauli factors cancel. A bounded first-order upwind finite-volume linear solve fixes incoming fL/fR only. The optional prescribed nonthermal mode-selective left injector sets mode 2's incoming occupation independently, not through an equilibrium reservoir. Its default 0.3 is below mode 1's 0.9, but it may also be raised above mode 1. Conservative total flux is computed at cell faces; individual subband fluxes may vary. Occupations and face flux have finite-grid error; increasing N tests convergence. These are chosen elastic rates, not calibrated device parameters. The grid-error diagnostic applies to equal per-mode inflows (including one open mode). For M open modes, alpha=beta+(M-1)gamma/2, T_cont=1/(1+alpha L), T_FV=(1+alpha dx)/(1+alpha L+alpha dx), and the percentage is 100(T_FV/T_cont-1). It compares transmission even when the contact current is zero. For unequal mode inflows the metric is not applicable; refine N and compare profiles and flux. Occupation and spectral face flux use fixed physical x=0–100 nm axes; flux is dimensionless with fixed bounds [-2.1,2.1]. A separate dispersion plot uses k in [-0.8,0.8] nm⁻¹ and E in [0,280] meV, showing the selected energy and propagating k roots. The inverse-length shell equation cancels speed: changing energy without changing the active subbands leaves occupations unchanged, while those physical k roots move. The inter-subband and mode-selective controls are disabled when only one subband propagates, without erasing their stored settings.", ko: "길이 100 nm인 균일한 wire에서 총에너지 하나를 고정합니다. W=10 nm, H=8 nm, m*=0.19m0인 첫 두 subband에서, 주어진 에너지로 전자가 진행할 수 있는 state만 포함합니다. E<=140 meV이므로 세 번째 subband에는 이 에너지로 진행할 수 있는 state가 없습니다. 같은 subband에서 방향이 바뀌는 transition에는 beta를, 다른 subband로 옮겨 가는 transition에는 각 방향 쌍마다 gamma/2를 사용합니다. 이렇게 정한 inverse-length 계수 kappa_ab는 대칭입니다. C_a=v_a sum_b kappa_ab(f_b-f_a)이며 density weight가 1/v_a에 비례하므로 입자 수가 보존됩니다. 대칭인 elastic transition에서는 gain과 loss의 occupation 곱이 상쇄되어 f_b-f_a만 남습니다. Boundary에서는 들어오는 fL/fR만 지정하고, 내부 occupation은 first-order upwind finite-volume 방식으로 구합니다. Mode별 주입을 켜면 왼쪽에서 mode 2의 occupation을 독립적으로 지정합니다. 기본값 0.3은 mode 1의 0.9보다 작지만 첫 번째 mode의 occupation보다 크게 지정해도 됩니다. 이 옵션에서는 equilibrium reservoir 대신 nonthermal mode-selective injector의 주입 조건을 직접 지정합니다. 전체 flux는 모든 cell face에서 같지만, subband별 flux는 위치에 따라 달라질 수 있습니다. 결과에는 grid 오차가 있으므로 N을 늘려 수렴을 확인해야 합니다. 실제 소자에 맞춘 parameter는 아닙니다. Transmission의 grid 오차는 왼쪽에서 각 mode에 같은 inflow를 주고 오른쪽에서도 그렇게 지정했을 때 계산합니다. 이 에너지에서 전자가 진행할 수 있는 mode가 하나인 경우도 포함합니다. 진행 가능한 mode 수를 M이라고 하면 alpha=beta+(M-1)gamma/2, T_cont=1/(1+alpha L), T_FV=(1+alpha dx)/(1+alpha L+alpha dx)이고 백분율은 100(T_FV/T_cont-1)입니다. Contact 전류가 0이어도 transmission의 오차는 계산할 수 있습니다. 왼쪽이나 오른쪽에서 mode마다 다른 inflow를 지정하면 이 기준값을 사용할 수 없습니다. 이때는 N을 늘려 profile과 flux가 얼마나 달라지는지 비교해야 합니다. Occupation과 spectral face flux의 x 축은 0–100 nm로 고정하며, dimensionless flux의 축은 ±2.1로 고정합니다. 별도의 dispersion 그래프는 k 축을 ±0.8 nm⁻¹, E 축을 0–280 meV로 고정하고 선택한 energy와 진행 가능한 k를 표시합니다. 여기서 정한 inverse-length 계수를 고정하면 shell 방정식의 양변에서 speed가 약분됩니다. 따라서 진행 가능한 subband가 그대로이면 energy를 바꿔도 occupation은 같습니다. 반면 energy와 speed가 달라지므로 그래프에서 가능한 k 위치는 움직입니다. 진행 가능한 subband가 하나뿐일 때는 inter-subband와 mode별 주입 조작을 비활성화합니다. 설정값은 저장해 두었다가 두 번째 subband에서 진행할 수 있을 때 다시 사용합니다."}
msbte-quiz:
  bundle: msbte
  stylesheet: /assets/css/article-labs-msbte.css
  title: {en: "Check the physics: energy, occupation and contacts", ko: "개념 확인: 에너지, occupation, contact 조건"}
  note: {en: "Four deterministic conceptual questions use explicit subband edges of 50 and 110 meV and total energies 90 or 130 meV. These rounded schematic values are not the exact geometry eigenenergies used by the other labs. Questions cover elastic energy conservation, open modes, equal-occupation equilibrium and incoming-only reservoir boundaries. Answers stay in the browser. No user-supplied code is executed.", ko: "네 문제에서 subband edge를 50·110 meV, 총에너지를 90 또는 130 meV로 지정합니다. 이해를 돕기 위해 반올림한 값이며, 다른 실습에서 사용하는 단면의 정확한 eigenenergy는 아닙니다. Elastic collision 전후의 에너지, 주어진 에너지에서 진행 가능한 state, equilibrium에서의 occupation, contact에서 지정할 boundary condition을 묻는 문제입니다. 답은 브라우저 안에서만 처리하며, 사용자가 입력한 코드를 실행하지 않습니다."}
