drude-step:
  bundle: drude
  stylesheet: /assets/css/article-labs-drude.css
  title: {en: "Field step: electrons drift, conventional current builds", ko: "전기장을 켠 뒤의 drift와 전류"}
  note: {en: "Uniform electron density; isotropic constant m*=0.1–2 m0; momentum relaxation time τtr=10–500 fs. E is switched on from zero with u(0)=0. Charge is −e and J=−en u. L=1 μm, A=(100 nm)²; I=JA and V=EL. No spatial electrostatic solve, energy relaxation or contact resistance. All inputs are bounded; no user code is executed.", ko: "전자 밀도는 균일하고 질량은 방향에 따라 달라지지 않는 상수 m*=0.1–2 m0입니다. Momentum relaxation time은 τtr=10–500 fs입니다. u(0)=0인 상태에서 E를 켭니다. 전자의 전하는 −e이고 J=−en u입니다. L=1 μm, A=(100 nm)²이며 I=JA, V=EL로 계산합니다. 위치에 따른 전기장 계산, energy relaxation, contact resistance는 포함하지 않습니다. 입력은 정해진 범위로 제한하며 사용자 코드는 실행하지 않습니다."}
drude-ac:
  bundle: drude
  stylesheet: /assets/css/article-labs-drude.css
  title: {en: "AC conductivity: magnitude, dissipation and phase lag", ko: "AC conductivity: 크기, dissipation, phase lag"}
  note: {en: "Steady periodic isotropic Drude solution with exp(−iωt), σ=σ0/(1−iωτtr). Fixed n=10²³ m⁻³, m*=0.2m0, τtr=100 fs, E0=1000 V/m; σ0≈1408.97 S/m. Conductivity uses S/m and frequency uses THz; the waveform uses a fixed 0–2 ps interval. Field and current have separately labeled physical units in shared plotting space. Positive Imσ gives current lag and Reσ≥0 gives passive cycle-averaged power. At ω=0 both are static. Switch-on transients are excluded.", ko: "exp(−iωt) convention에서 주기적인 Drude 해 σ=σ0/(1−iωτtr)를 계산합니다. n=10²³ m⁻³, m*=0.2m0, τtr=100 fs, E0=1000 V/m로 고정하며 σ0≈1408.97 S/m입니다. Conductivity는 S/m, 주파수는 THz 단위로 표시하고, 시간 범위는 0–2 ps로 고정합니다. 전기장과 전류는 같은 좌표 안에 각각의 물리 단위를 붙여 표시합니다. Imσ>0이면 전류가 전기장보다 늦고, Reσ≥0이므로 한 주기 평균 전력은 음수가 아닙니다. ω=0이면 둘 다 시간에 따라 일정합니다. 전기장을 켠 직후의 transient는 포함하지 않습니다."}
drude-band:
  bundle: drude
  stylesheet: /assets/css/article-labs-drude.css
  title: {en: "Band derivatives: velocity is not curvature mass", ko: "Band의 미분: 속도와 curvature mass는 다릅니다"}
  note: {en: "One-dimensional nearest-neighbour band ε=2tₕ(1−cos ka), v=2tₕa sin(ka)/ℏ, mcurv⁻¹=2tₕa²cos(ka)/ℏ². Fixed physical k window −32 to 32 nm⁻¹, energy 0–12.5 eV, velocity ±10×10⁶ m/s, inverse mass ±85 m0/mcurv. Repeated periods are an extended-zone representation of the same band; dashed lines track first-zone boundaries ±π/a. The probe uses ka/π but its plotted coordinate is the physical k. The optional tₕ(ka)² approximation is limited to |ka|≤π/2. Local negative curvature does not determine DC conductivity without occupations and collisions.", ko: "1D nearest-neighbour band ε=2tₕ(1−cos ka), v=2tₕa sin(ka)/ℏ, mcurv⁻¹=2tₕa²cos(ka)/ℏ²를 계산합니다. k 축은 −32~32 nm⁻¹, energy는 0–12.5 eV, velocity는 ±10×10⁶ m/s, inverse mass는 ±85 m0/mcurv로 고정합니다. 반복되는 곡선은 같은 band의 extended-zone 표현이며, 수직 점선은 첫 Brillouin zone의 경계 ±π/a입니다. 관찰 지점은 ka/π로 고르되 그래프에는 물리 단위의 k로 표시합니다. tₕ(ka)² 근사는 |ka|≤π/2에서만 표시합니다. 특정 지점의 curvature가 음수여도 DC conductivity를 알려면 occupation과 collision을 함께 계산해야 합니다."}
drude-scattering:
  bundle: drude
  stylesheet: /assets/css/article-labs-drude.css
  title: {en: "Scattering angle: event lifetime versus momentum relaxation", ko: "Scattering angle: event lifetime과 momentum relaxation"}
  note: {en: "Three-dimensional Born angular kernel proportional to [1+xₛ sin²(θ/2)]⁻², xₛ=0.01–400. Shape is normalized at fixed total event rate 1/τq; this is not a qs sweep at fixed potential strength. Angular density includes sinθ and integrates with dθ in radians. The transport-weighted density integrates to mean(1−cosθ), with τtr/τq its reciprocal. Isotropic 3D and pure-reversal two-direction benchmarks are separate models; the latter has τtr=τq/2. Static elastic weak-scattering assumptions apply.", ko: "3D Born angular kernel은 [1+xₛ sin²(θ/2)]⁻²에 비례하며 xₛ=0.01–400입니다. 전체 event rate 1/τq를 고정하고 normalized kernel의 모양만 바꿉니다. Potential strength를 고정한 채 qs를 바꾸는 계산과는 다릅니다. 각도에 따른 확률밀도에는 sinθ가 포함되며, radian 단위의 dθ로 적분합니다. Transport-weighted density를 적분하면 평균 (1−cosθ)가 되고, τtr/τq는 그 역수입니다. 3D isotropic scattering과 두 방향 pure reversal은 별개의 비교 모델입니다. Pure reversal에서는 τtr=τq/2입니다. Static elastic weak-scattering 조건을 가정합니다."}
drude-charge:
  bundle: drude
  stylesheet: /assets/css/article-labs-drude.css
  title: {en: "Charge dynamics: periodic density, Poisson field and continuity", ko: "Charge dynamics: 밀도 변화, 전기장, continuity"}
  note: {en: "Small periodic perturbation δn=0.05n0 a(s)cos(qx), qL=2π, a″+a′+Ω²a=0, a(0)=1 and a′(0)=0. Fixed τtr=100 fs, m*=0.2m0, εb=11.7 and L=100 nm; Ω varies n0=εm*(Ω/τtr)²/e². The compensating background is time-independent within each setting. Separate fixed physical axes show density amplitude, density profile, Poisson field and conventional current. E=−eA0 a sin(qx)/(εq), J=eA0 a′ sin(qx)/(qτtr), A0=0.05n0. Quasistatic pressure-free model; diffusion and contacts omitted. Charge continuity is −e∂tδn+∂xJ=0. Critical Ω=0.5; underdamped frequency sqrt(ωp²−1/(4τtr²)).", ko: "작은 periodic perturbation δn=0.05n0 a(s)cos(qx)를 계산합니다. qL=2π, a″+a′+Ω²a=0, a(0)=1, a′(0)=0입니다. τtr=100 fs, m*=0.2m0, εb=11.7, L=100 nm로 고정하며, Ω를 바꾸면 n0=εm*(Ω/τtr)²/e²에 따라 기준 밀도가 달라집니다. 각 설정에서 보상 양전하의 분포는 시간에 따라 변하지 않습니다. 밀도 변화의 진폭·공간 분포·전기장·전류를 각각 고정된 물리 단위의 축에 그립니다. A0=0.05n0일 때 E=−eA0 a sin(qx)/(εq), J=eA0 a′ sin(qx)/(qτtr)입니다. Quasistatic 근사이며 pressure·diffusion·contact는 생략합니다. 전하 보존식은 −e∂tδn+∂xJ=0입니다. Ω=0.5에서 critical damping이고 감쇠 진동 주파수는 sqrt(ωp²−1/(4τtr²))입니다."}
drude-quiz:
  bundle: drude
  stylesheet: /assets/css/article-labs-drude.css
  title: {en: "Check the physics: fields, bands, scattering and relaxation", ko: "개념 확인: 전기장, band, scattering, relaxation"}
  note: {en: "Five diagram-backed questions cover neutral regions with nonzero uniform field, local band curvature, angular momentum relaxation, AC current lag and momentum versus energy relaxation, and the conditions for scalar mobility. Answers remain in the browser; question and selected answer can be shared or reset.", ko: "다섯 문제의 그림을 보고 bulk charge density가 0인 영역의 균일한 전기장, 특정 지점의 band curvature, scattering 각도에 따른 momentum relaxation, AC 전류의 phase lag, momentum relaxation과 energy relaxation의 차이, scalar mobility의 조건을 확인합니다. 답은 브라우저 안에서만 처리하며, 문제와 선택한 답을 공유하거나 초기화할 수 있습니다."}
