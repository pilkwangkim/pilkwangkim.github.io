drude-step:
  bundle: drude
  stylesheet: /assets/css/article-labs-drude.css
  title: {en: "Field step: electrons drift, conventional current builds", ko: "전기장을 켠 뒤의 drift와 전류"}
  note: {en: "Uniform electron density; isotropic constant m*=0.1–2 m0; momentum relaxation time τtr=10–500 fs. E is switched on from zero with u(0)=0. Charge is −e and J=−en u. L=1 μm, A=(100 nm)²; I=JA and V=EL. No spatial electrostatic solve, energy relaxation or contact resistance. All inputs are bounded; no user code is executed.", ko: "전자 밀도는 균일하고 질량은 방향에 따라 달라지지 않는 상수 m*=0.1–2 m0입니다. Momentum relaxation time은 τtr=10–500 fs입니다. u(0)=0인 상태에서 E를 켭니다. 전자의 전하는 −e이고 J=−en u입니다. L=1 μm, A=(100 nm)²이며 I=JA, V=EL로 계산합니다. 위치에 따른 전기장 계산, energy relaxation, contact resistance는 포함하지 않습니다. 입력은 정해진 범위로 제한하며 사용자 코드는 실행하지 않습니다."}
drude-ac:
  bundle: drude
  stylesheet: /assets/css/article-labs-drude.css
  title: {en: "AC conductivity: magnitude, dissipation and phase lag", ko: "AC conductivity: 크기, dissipation, phase lag"}
  note: {en: "Steady periodic isotropic Drude solution with exp(−iωt): σ/σ0=1/(1−iωτtr). Normalized real and imaginary conductivity, field and conventional current are shown. Positive Imσ corresponds to current lag in this convention. Reσ≥0 ensures passive cycle-averaged power. At ωτtr=0 the field and current are static and the phase control is inactive. Switch-on transients are excluded.", ko: "exp(−iωt) convention을 쓰며, 주기적인 변화가 자리 잡은 뒤의 Drude 해 σ/σ0=1/(1−iωτtr)를 구합니다. normalized conductivity의 실수부와 허수부, 전기장, conventional current를 표시합니다. 이 convention에서는 Imσ>0이면 전류가 전기장보다 늦습니다. Reσ≥0이므로 한 주기 평균 전력은 음수가 아닙니다. ωτtr=0에서는 전기장과 전류가 시간에 따라 변하지 않으며 phase는 조절하지 않습니다. 전기장을 켠 직후의 transient는 포함하지 않습니다."}
drude-band:
  bundle: drude
  stylesheet: /assets/css/article-labs-drude.css
  title: {en: "Band derivatives: velocity is not curvature mass", ko: "Band의 미분: 속도와 curvature mass는 다릅니다"}
  note: {en: "One-dimensional nearest-neighbour band ε=2tₕ(1−cos ka), v=2tₕa sin(ka)/ℏ, mcurv⁻¹=2tₕa²cos(ka)/ℏ². The inverse mass m0/mcurv stays finite through zero curvature; no divergent mass curve is plotted. Negative local curvature does not by itself imply negative DC conductivity. The optional tₕ(ka)² curve is a band-bottom approximation. No collision or occupied-distribution conductivity calculation is performed.", ko: "1D nearest-neighbour band ε=2tₕ(1−cos ka), v=2tₕa sin(ka)/ℏ, mcurv⁻¹=2tₕa²cos(ka)/ℏ²를 계산합니다. Curvature가 0인 지점에서도 inverse mass m0/mcurv는 유한하므로, 발산하는 질량 곡선 대신 이 값을 표시합니다. 특정 지점의 curvature가 음수라고 해서 DC conductivity도 음수인 것은 아닙니다. 선택해서 보는 tₕ(ka)²는 band bottom 부근에서만 쓸 수 있는 근사입니다. Collision과 전자의 occupation distribution을 이용해 conductivity를 구하지는 않습니다."}
drude-scattering:
  bundle: drude
  stylesheet: /assets/css/article-labs-drude.css
  title: {en: "Scattering angle: event lifetime versus momentum relaxation", ko: "Scattering angle: event lifetime과 momentum relaxation"}
  note: {en: "Three-dimensional Born angular kernel proportional to [1+xₛ sin²(θ/2)]⁻², xₛ=0.01–400. Shape is normalized at fixed total event rate 1/τq; this is not a qs sweep at fixed potential strength. Angular density includes sinθ and integrates with dθ in radians. The transport-weighted density integrates to mean(1−cosθ), with τtr/τq its reciprocal. Isotropic 3D and pure-reversal two-direction benchmarks are separate models; the latter has τtr=τq/2. Static elastic weak-scattering assumptions apply.", ko: "3D Born angular kernel은 [1+xₛ sin²(θ/2)]⁻²에 비례하며 xₛ=0.01–400입니다. 전체 event rate 1/τq를 고정하고 normalized kernel의 모양만 바꿉니다. Potential strength를 고정한 채 qs를 바꾸는 계산과는 다릅니다. 각도에 따른 확률밀도에는 sinθ가 포함되며, radian 단위의 dθ로 적분합니다. Transport-weighted density를 적분하면 평균 (1−cosθ)가 되고, τtr/τq는 그 역수입니다. 3D isotropic scattering과 두 방향 pure reversal은 별개의 비교 모델입니다. Pure reversal에서는 τtr=τq/2입니다. Static elastic weak-scattering 조건을 가정합니다."}
drude-charge:
  bundle: drude
  stylesheet: /assets/css/article-labs-drude.css
  title: {en: "Charge dynamics: periodic density, Poisson field and continuity", ko: "Charge dynamics: 밀도 변화, 전기장, continuity"}
  note: {en: "Small periodic 1D perturbation in a uniform electron fluid with fixed neutralizing positive background: δn/n0=0.05 a(s)cos(qx), qL=2π, s=t/τtr. Quasistatic electrostatic, no pressure, diffusion or contacts. a″+a′+Ω²a=0 with a(0)=1,a′(0)=0 and Ω=ωpτtr. E/Escale=−a sin(qx), J/Jscale=a′ sin(qx), Escale=eA0/(εq), Jscale=eA0/(qτtr). Charge continuity is −e∂tδn+∂xJ=0. Critical Ω=0.5 is evaluated stably; actual underdamped frequency is sqrt(ωp²−1/(4τtr²)), not ωp.", ko: "균일한 electron fluid의 전하를 고정된 양전하 배경이 상쇄합니다. 여기에 작은 1D periodic perturbation δn/n0=0.05 a(s)cos(qx)를 주고 시간에 따른 변화를 계산합니다. qL=2π, s=t/τtr이며, quasistatic electrostatic을 가정하고 pressure, diffusion, contact는 포함하지 않습니다. a″+a′+Ω²a=0, a(0)=1, a′(0)=0이고 Ω=ωpτtr입니다. E/Escale=−a sin(qx), J/Jscale=a′ sin(qx)이며 Escale=eA0/(εq), Jscale=eA0/(qτtr)입니다. Charge continuity는 −e∂tδn+∂xJ=0입니다. Ω=0.5인 critical damping에서도 해를 안정적으로 계산합니다. Underdamped일 때의 실제 진동 주파수는 ωp가 아니라 sqrt(ωp²−1/(4τtr²))입니다."}
drude-quiz:
  bundle: drude
  stylesheet: /assets/css/article-labs-drude.css
  title: {en: "Check the physics: fields, bands, scattering and relaxation", ko: "개념 확인: 전기장, band, scattering, relaxation"}
  note: {en: "Five diagram-backed questions cover neutral regions with nonzero uniform field, local band curvature, angular momentum relaxation, AC current lag and momentum versus energy relaxation, and the conditions for scalar mobility. Answers remain in the browser; question and selected answer can be shared or reset.", ko: "다섯 문제의 그림을 보고 bulk charge density가 0인 영역의 균일한 전기장, 특정 지점의 band curvature, scattering 각도에 따른 momentum relaxation, AC 전류의 phase lag, momentum relaxation과 energy relaxation의 차이, scalar mobility의 조건을 확인합니다. 답은 브라우저 안에서만 처리하며, 문제와 선택한 답을 공유하거나 초기화할 수 있습니다."}
