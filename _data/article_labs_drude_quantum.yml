drude-packet:
  bundle: drude-quantum
  title: {en: "A wave packet: center motion is not its width", ko: "Wave packet의 중심 이동과 퍼짐"}
  note: {en: "Exact real-Gaussian solution of a constant-mass one-dimensional quadratic-envelope Hamiltonian under a constant external force. Initial mean position and velocity are zero. Δx0 is the initial position standard deviation; t0=2m*Δx0²/ℏ, α=F t0²/(2m*Δx0), s=t/t0. The center is αs² and the width is √(1+s²), both in units of Δx0. No scattering or interband transition; a center expectation value is not a microscopic electron trajectory.", ko: "상수 질량을 갖는 1D quadratic-envelope Hamiltonian에서 일정한 외력을 가했을 때의 정확한 Gaussian 해입니다. 초기 평균 위치와 속도는 0입니다. Δx0는 초기 위치 분포의 standard deviation이며 t0=2m*Δx0²/ℏ, α=F t0²/(2m*Δx0), s=t/t0입니다. Δx0 단위로 중심은 αs², 폭은 √(1+s²)입니다. Scattering과 interband transition은 포함하지 않으며, 중심의 expectation value는 전자 하나의 microscopic 경로가 아닙니다."}
drude-transition:
  bundle: drude-quantum
  title: {en: "Finite-time transitions: a taller peak is not a total rate", ko: "Finite-time transition: peak 높이와 전체 적분은 다릅니다"}
  note: {en: "A constant perturbation switched on at t=0 gives the first-order kernel P=(|M|t/ℏ)²sinc²(ΔEt/(2ℏ)). Here 0≤|M|≤1 meV, 0≤t≤50 fs, so the resonant single-state P is below 0.006. The full energy area 2π|M|²t/ℏ has energy units; it is not a total probability. A continuum sum needs the density of states; an electron gas additionally needs appropriate occupation factors. First-order theory also requires the summed transition probability to remain much less than one, not just each individual probability.", ko: "일정한 perturbation을 t=0에서 켜면 first-order kernel은 P=(|M|t/ℏ)²sinc²(ΔEt/(2ℏ))입니다. 0≤|M|≤1 meV, 0≤t≤50 fs로 제한하므로 resonance에서 개별 state로의 P는 0.006보다 작습니다. 전체 energy 적분 2π|M|²t/ℏ의 단위는 에너지이며 total probability가 아닙니다. Continuum의 final state를 합하려면 density of states가 필요하고, electron gas에서는 occupation factor도 반영해야 합니다. First-order theory를 적용하려면 개별 확률뿐 아니라 전체 transition probability도 1보다 훨씬 작아야 합니다."}
drude-gaussian:
  bundle: drude-quantum
  title: {en: "A Gaussian scatterer: shape, Fourier amplitude and its square", ko: "Gaussian scatterer: 모양과 Fourier amplitude, 그리고 제곱"}
  note: {en: "Uℓ(x)=g exp[−x²/(2ℓ²)]/(√(2π)ℓ), with Ũ(q)=g exp[−q²ℓ²/2] in one dimension. Compare fixed integrated strength g with fixed peak height U(0). ℓ0 and gref>0 are reference scales. For fixed normalization length ℒ and final-state/kinematic prefactors, |Ũ/gref|² is a relative rate factor, not a complete scattering rate or transport lifetime. q is a wavevector transfer; physical momentum transfer is ℏq.", ko: "1D에서 Uℓ(x)=g exp[−x²/(2ℓ²)]/(√(2π)ℓ), Ũ(q)=g exp[−q²ℓ²/2]를 사용합니다. 적분한 세기 g를 고정하는 경우와 peak 높이 U(0)를 고정하는 경우를 비교합니다. ℓ0와 gref>0은 기준값입니다. Normalization length ℒ와 final-state·kinematic prefactor를 고정했을 때 |Ũ/gref|²는 상대적인 rate factor이며, 완전한 scattering rate나 transport lifetime은 아닙니다. q는 wavevector transfer이고 momentum transfer는 ℏq입니다."}
