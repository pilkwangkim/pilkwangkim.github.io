drude-packet:
  bundle: drude-quantum
  title: {en: "A wave packet: center motion is not its width", ko: "Wave packet의 중심 이동과 퍼짐"}
  note: {en: "Exact real-Gaussian solution of a constant-mass one-dimensional quadratic-envelope Hamiltonian under a constant external force. Fixed initial position standard deviation Δx0=10 nm and m*=m0 give fixed t0=2m0Δx0²/ℏ≈1.728 ps and F0=2m0Δx0/t0²≈0.0381 meV/nm. Initial mean position and velocity are zero; s=t/t0, α=F/F0. The center is Δx0 αs² and the width is Δx0√(1+s²). Plots use nm, ps and nm⁻¹ with fixed axis limits for every setting; the spatial window does not follow the packet or renormalize it. No scattering or interband transition; a center expectation value is not a microscopic electron trajectory.", ko: "일정한 외력을 받는 1D quadratic-envelope Hamiltonian의 정확한 Gaussian 해입니다. 초기 위치 분포의 standard deviation Δx0=10 nm와 m*=m0를 고정합니다. 기준값 t0=2m0Δx0²/ℏ≈1.728 ps, F0=2m0Δx0/t0²≈0.0381 meV/nm도 고정되어 있습니다. 초기 평균 위치와 속도는 0이며 s=t/t0, α=F/F0입니다. 중심은 Δx0 αs², 폭은 Δx0√(1+s²)입니다. 그래프는 nm, ps, nm⁻¹ 단위를 쓰고 모든 설정에서 축 범위를 유지합니다. Packet을 따라 원점을 옮기거나 보이는 범위만으로 다시 normalize하지 않습니다. Scattering과 interband transition은 포함하지 않으며, 중심의 expectation value는 전자 하나의 경로가 아닙니다."}
drude-transition:
  bundle: drude-quantum
  title: {en: "Finite-time transitions: a taller peak is not a total rate", ko: "Finite-time transition: peak 높이와 전체 적분은 다릅니다"}
  note: {en: "A constant perturbation switched on at t=0 gives the first-order kernel P=(|M|t/ℏ)²sinc²(ΔEt/(2ℏ)). Here 0≤|M|≤1 meV, 0≤t≤50 fs, so the resonant single-state P is below 0.006. The full energy area 2π|M|²t/ℏ has energy units; it is not a total probability. A continuum sum needs the density of states; an electron gas additionally needs appropriate occupation factors. First-order theory also requires the summed transition probability to remain much less than one, not just each individual probability.", ko: "일정한 perturbation을 t=0에서 켜면 first-order kernel은 P=(|M|t/ℏ)²sinc²(ΔEt/(2ℏ))입니다. 0≤|M|≤1 meV, 0≤t≤50 fs로 제한하므로 resonance에서 개별 state로의 P는 0.006보다 작습니다. 전체 energy 적분 2π|M|²t/ℏ의 단위는 에너지이며 total probability가 아닙니다. Continuum의 final state를 합하려면 density of states가 필요하고, electron gas에서는 occupation factor도 반영해야 합니다. First-order theory를 적용하려면 개별 확률뿐 아니라 전체 transition probability도 1보다 훨씬 작아야 합니다."}
drude-gaussian:
  bundle: drude-quantum
  title: {en: "A Gaussian scatterer: shape, Fourier amplitude and its square", ko: "Gaussian scatterer: 모양과 Fourier amplitude, 그리고 제곱"}
  note: {en: "Uℓ(x)=g exp[−x²/(2ℓ²)]/(√(2π)ℓ), with Ũ(q)=g exp[−q²ℓ²/2] in one dimension. Fixed reference values are ℓ0=1 nm and gref=1 eV nm. Compare fixed integrated strength g=1 eV nm with fixed peak U(0)=1/√(2π) eV. Separate fixed axes show U in eV, Ũ in eV nm and |Ũ|² in eV² nm²; the q control moves vertical probes and markers without rescaling the plots. |Ũ|² is not a complete scattering rate or transport lifetime without the normalization length and final-state/kinematic prefactors. Physical momentum transfer is ℏq.", ko: "1D에서 Uℓ(x)=g exp[−x²/(2ℓ²)]/(√(2π)ℓ), Ũ(q)=g exp[−q²ℓ²/2]를 사용합니다. 기준값 ℓ0=1 nm, gref=1 eV nm로 고정하고 g=1 eV nm를 유지하는 경우와 peak U(0)=1/√(2π) eV를 유지하는 경우를 비교합니다. U, Ũ, |Ũ|²는 각각 eV, eV nm, eV² nm² 단위로 따로 그립니다. 축 범위는 항상 같고 q를 바꾸면 세로 기준선과 점만 이동합니다. |Ũ|²에 normalization length와 final-state·kinematic prefactor까지 반영해야 rate를 구할 수 있으며, 그 자체는 완전한 scattering rate나 transport lifetime이 아닙니다. Momentum transfer는 ℏq입니다."}
