predictive-threshold:
  bundle: predictive
  title: {en: "Ranking stays fixed while the decision threshold moves", ko: "판정 threshold를 바꿔도 순위는 그대로다"}
  note: {en: "Twelve invented probability/label pairs, six positives and six negatives. These values and metrics are separate from the article's OOF results.", ko: "양성 6개, 음성 6개인 가상 확률·label 12쌍입니다. 이 값과 지표는 글의 OOF 결과와 별개입니다."}
predictive-target-encoding:
  bundle: predictive
  title: {en: "Small categories shrink toward the training prior", ko: "작은 category는 학습 prior 쪽으로 줄어든다"}
  note: {en: "The article's weighted target-encoding formula with invented category statistics and prior 0.20. A held-out label changes only the deliberately leaky comparison.", ko: "글의 가중 target encoding 식에 가상 category 통계와 prior 0.20을 적용합니다. 제외한 label은 의도적으로 누출시킨 비교값에만 영향을 줍니다."}
predictive-colors:
  bundle: predictive
  title: {en: "Color is a flux ratio on a logarithmic scale", ko: "color는 로그 척도로 나타낸 flux 비율이다"}
  note: {en: "Measured class-median color presets from the article. Absolute brightness is illustrative; the flux-ratio identity uses a common reference flux.", ko: "글에서 측정한 class별 median color를 초기값으로 씁니다. 절대 밝기는 예제이며 flux 비율의 항등식은 공통 reference flux를 사용합니다."}
predictive-multipliers:
  bundle: predictive
  title: {en: "Class multipliers move the hard-label boundary", ko: "class multiplier는 hard label의 경계를 바꾼다"}
  note: {en: "Invented probability vectors with the article's selected multipliers. The example assigns labels but makes no OOF balanced-accuracy claim.", ko: "가상 확률 벡터에 글에서 선택한 multiplier를 적용합니다. label을 고르는 예제이며 OOF balanced accuracy를 주장하지 않습니다."}
predictive-cutoff:
  bundle: predictive
  title: {en: "Availability and validation both need a time boundary", ko: "가용 자료와 검증 모두 시간 경계가 필요하다"}
  note: {en: "The notebook's aligned cutoff was 93. Adjustable availability dates and four example row days are synthetic; an explicit prediction-date cap illustrates the as-of condition.", ko: "노트북의 aligned cutoff는 93입니다. 조절하는 가용 날짜와 예제 row day 4개는 가상이며 예측 시점의 상한으로 as-of 조건을 보여 줍니다."}
