galois-quadratic:
  bundle: galois
  stylesheet: /assets/css/galois-lab.css
  title: {en: "Arithmetic in Q(√2): two coordinates, one field", ko: "Q(√2)의 사칙연산: 좌표 두 개로 표현하는 field"}
  note: {en: "Exact integer coefficients from −9 to 9 represent u=a+b√2 and v=c+d√2. Products reduce using (√2)²=2. The inverse uses (a−b√2)/(a²−2b²), displayed as reduced rational coefficients. The zero element has no inverse. Conjugation is the Q-linear matrix diag(1,−1), which also preserves multiplication. No floating-point comparison is used for these identities.", ko: "u=a+b√2와 v=c+d√2의 계수는 −9부터 9까지의 정수로 고릅니다. 곱셈에는 (√2)²=2를 사용합니다. Inverse는 (a−b√2)/(a²−2b²)로 계산하고, 약분한 유리수 계수로 표시합니다. 0에는 inverse가 없습니다. Conjugation은 Q-linear matrix diag(1,−1)로 표현되며, 곱셈도 보존합니다. 이 항등식들은 floating-point 비교 없이 확인합니다."}
galois-permutations:
  bundle: galois
  title: {en: "24 root permutations, only four automorphisms", ko: "근의 permutation 24개, 그중 automorphism은 네 개"}
  note: {en: "The ordered roots are [√2,−√2,√3,−√3] of (x²−2)(x²−3). Every displayed mapping is a bijection of this root set. Exact tests check the individual square relations and opposite pairs. Exactly four mappings extend to Q-automorphisms of Q(√2,√3): independent sign choices for √2 and √3. Passing only the quartic-root test is not sufficient.", ko: "(x²−2)(x²−3)의 근은 [√2,−√2,√3,−√3] 순서입니다. 화면에 나오는 mapping은 모두 이 네 근 사이의 일대일 대응입니다. 각 근의 제곱값과 서로 음수인 쌍이 보존되는지 정확히 검사합니다. √2와 √3의 부호를 독립적으로 고르는 네 mapping만 Q(√2,√3)의 Q-automorphism으로 확장됩니다. 같은 quartic의 근으로 보낸다는 사실만으로는 충분하지 않습니다."}
galois-correspondence:
  bundle: galois
  title: {en: "Choose symmetries and find their fixed field", ko: "Symmetry를 고르고 fixed field 찾기"}
  note: {en: "L=Q(√2,√3), with basis [1,√2,√3,√6]. σ flips √2 and τ flips √3. Checked transformations generate a subgroup under composition, represented exactly by XOR of two sign bits. A basis term survives precisely when every subgroup element fixes it. The five possible subgroups give the five intermediate fields, with |H|[Lᴴ:Q]=4.", ko: "L=Q(√2,√3)의 basis는 [1,√2,√3,√6]입니다. σ는 √2의 부호를, τ는 √3의 부호를 바꿉니다. 선택한 변환과 그 composition을 모두 포함하도록 subgroup을 만듭니다. 부호를 나타내는 두 bit에 XOR를 적용해 정확히 계산합니다. Subgroup의 모든 원소가 고정하는 basis term만 남습니다. 다섯 가지 subgroup은 다섯 intermediate field에 하나씩 대응하며 |H|[Lᴴ:Q]=4입니다."}
galois-derived:
  bundle: galois
  title: {en: "Compute the derived series: where does it stop?", ko: "Derived series를 계산하면 어디에서 멈출까?"}
  note: {en: "Finite permutation groups C5,S3,S4,A5,S5 are fully enumerated (at most 120 elements). compose(p,q)[i]=p[q[i]] applies q first. Each derived subgroup includes all pqp⁻¹q⁻¹ and all their compositions and inverses. Orders count the elements directly. The series stops at the identity or at an unchanged subgroup. A5 has 60 elements and equals its own derived subgroup: repeating the operation never reaches the one-element identity group.", ko: "C5,S3,S4,A5,S5의 원소를 모두 열거합니다. 각 group의 원소는 최대 120개입니다. compose(p,q)[i]=p[q[i]]이므로 q부터 적용합니다. 각 derived subgroup에는 모든 pqp⁻¹q⁻¹뿐 아니라 이들의 composition과 inverse도 포함합니다. Order는 원소의 개수를 직접 센 값입니다. Identity group에 도달하거나 같은 subgroup이 다시 나오면 멈춥니다. A5는 원소가 60개이며 derived subgroup을 구해도 다시 A5입니다. 같은 연산을 반복해도 원소가 하나인 identity group에 도달하지 못합니다."}
galois-quintic:
  bundle: galois
  title: {en: "A numerical root still exists without a radical formula", ko: "Radical 공식이 없어도 근삿값은 구할 수 있다"}
  note: {en: "Two fixed rational quintics: x⁵−5x+1 (Galois group S5) and x⁵−2 (solvable group of order 20). The first has three real roots with sign-changing brackets [−3,−1],[−1,1],[1,3]; the second has one real root in [1,3]. All initial brackets have width 2. Bisection uses ordinary double precision and at most 40 iterations. The displayed interval and residual are numerical, not certificates of radical solvability. The exact nonsolvability proof uses shifted Eisenstein irreducibility and complex conjugation in the article.", ko: "유리계수 quintic 두 개를 비교합니다. x⁵−5x+1의 Galois group은 S5이고, x⁵−2의 group은 order가 20인 solvable group입니다. 첫 다항식에는 실근이 세 개 있고, 각각 부호가 바뀌는 구간 [−3,−1], [−1,1], [1,3] 안에 있습니다. 둘째 다항식의 유일한 실근은 [1,3]에 있습니다. 처음 구간의 폭은 모두 2입니다. Bisection은 double precision으로 최대 40번 반복합니다. 화면의 구간과 residual은 수치 계산 결과이며, radical solvability를 증명하지는 않습니다. 본문에서는 변수를 이동해 Eisenstein criterion을 적용하고, complex conjugation으로 nonsolvability를 정확히 증명합니다."}
galois-quiz:
  bundle: galois
  title: {en: "Five illustrated checks on Galois theory", ko: "그림으로 확인하는 Galois theory 다섯 문제"}
  note: {en: "Five fixed questions test radical operations, the distinction between linear maps and field automorphisms, root-relation preservation, reversed Galois correspondence, and the distinction between nonabelian and nonsolvable. Diagrams show the exact inputs. Hints do not select an answer. Each choice receives its own explanation. Previous/Next preserves answers; Reset clears all answers and hints. No answers are submitted externally.", ko: "다섯 문제에서 radical 연산, linear map과 field automorphism의 차이, 근 사이의 관계 보존, Galois correspondence에서 포함관계가 반대로 대응한다는 점, nonabelian과 nonsolvable의 차이를 확인합니다. 그림에 각 문제의 입력과 조건이 주어집니다. 힌트를 열어도 답이 자동으로 선택되지는 않습니다. 각 보기에는 별도의 해설이 있습니다. 이전·다음 문제로 이동해도 선택한 답은 유지됩니다. Reset하면 모든 답과 힌트가 지워집니다. 답을 외부로 전송하지 않습니다."}
