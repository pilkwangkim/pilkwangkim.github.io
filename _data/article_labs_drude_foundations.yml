drude-bloch:
  bundle: drude-foundations
  title: {en: "Bloch states: equal probabilities, different complex phases", ko: "Bloch state: probability는 같아도 phase는 다릅니다"}
  note: {en: "Four orthonormal localized basis states on a periodic nearest-neighbour ring. H has diagonal 2tₕ and hopping −tₕ on bonds 0–1, 1–2, 2–3, 3–0. The only allowed ka values are 0, π/2, π, 3π/2; cj=exp(i ka j)/2 and ε=2tₕ(1−cos ka). Plots show complex coefficients and |cj|², not electron motion. No scattering, occupation distribution or transport calculation. The eigenstate residual is computed by explicit Hamiltonian multiplication; its small nonzero value is floating-point roundoff.", ko: "서로 orthonormal인 네 개의 localized basis state를 periodic nearest-neighbour ring으로 연결합니다. H의 diagonal은 2tₕ이고, bond 0–1, 1–2, 2–3, 3–0의 hopping은 −tₕ입니다. 가능한 ka는 0, π/2, π, 3π/2뿐이며 cj=exp(i ka j)/2, ε=2tₕ(1−cos ka)입니다. 그래프는 complex coefficient와 |cj|²를 표시하며 전자의 이동을 나타내지 않습니다. Scattering, occupation distribution, transport는 계산하지 않습니다. Eigenstate residual은 Hamiltonian을 직접 곱해서 구하며, 0에 가까운 작은 오차는 floating-point 계산 때문입니다."}
drude-occupation:
  bundle: drude-foundations
  title: {en: "Occupation: conserve electron number, reverse current direction", ko: "Occupation을 바꿔도 전자 수는 일정하고 전류는 달라집니다"}
  note: {en: "Synthetic two-direction model with velocities ±v and g=10²³ available single-spin states per m³ in each equal-weight group. Both start at f0=1/2; f+=1/2−δ and f−=1/2+δ, −1/2≤δ≤1/2. Thus 0≤f±≤1 and n=g(f++f−)=g is fixed. J=−egv(f+−f−), normalized by e g vref with vref=10⁵ m/s. No extra spin factor. Occupations are per-state mean occupancies, not a one-electron distribution normalized over two groups. δ is prescribed, not derived from a field or collision equation; endpoint examples are not a linear-response approximation.", ko: "속도가 각각 ±v인 두 group을 비교하는 간단한 모델입니다. 각 group에는 single-spin state가 단위 부피당 g=10²³ m⁻³개씩 있고, 처음 occupation은 f0=1/2입니다. f+=1/2−δ, f−=1/2+δ로 바꾸며 −1/2≤δ≤1/2로 제한합니다. 따라서 0≤f±≤1이고 전체 밀도 n=g(f++f−)=g는 일정합니다. J=−egv(f+−f−)를 계산하고 vref=10⁵ m/s인 e g vref로 나누어 표시합니다. Spin factor를 추가하지 않습니다. f는 state별 평균 occupation이며 전자 하나의 확률을 두 group에 나눈 값이 아닙니다. δ를 직접 지정하므로 전기장이나 collision equation에서 구한 결과가 아니며, 양 끝값의 예시는 linear response 근사가 아닙니다."}
