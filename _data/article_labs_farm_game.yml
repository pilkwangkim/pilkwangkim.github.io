kaggriculture-farm-game:
  bundle: farm-game
  stylesheet: /assets/css/farm-game.css
  title: {en: "Ten days to run a farm", ko: "열흘 동안 직접 운영하는 농장"}
  note:
    en: "A four-plot, ten-day teaching game starts with 60 coins and two work units per day. Wheat/carrot/tomato use the article’s seed costs (10/20/50), base sale prices (25/35/60) and first-yield delays (2/2/8 cared-for nights). Each plant, water or harvest action uses one work unit; planting includes water that day. Rain waters every plot; a dry plot without water makes no growth that night. Wheat and carrots clear after one unit; tomatoes yield again after another cared-for night. Up to three temporary hires cost 1, 1, 2 coins and add one work unit each, resetting daily. The seed fixes rain (45% per day) and independent daily sale prices (base × uniform[0.8,1.2], rounded). Harvest sells immediately. Only cash counts after day ten; no crop salvage, land purchases, movement, opponents or market impact. Replaying both paths with the same seed holds weather and prices fixed."
    ko: "네 밭과 열흘로 구성한 학습용 게임입니다. 초기 현금은 60, 하루 기본 작업은 2회입니다. 밀·당근·토마토의 씨앗 비용(10/20/50), 기준 판매가(25/35/60), 첫 수확까지 필요한 관리된 밤 수(2/2/8)는 본문 표를 따릅니다. 파종·물 주기·수확은 각각 작업 1회를 쓰며 파종에는 당일 물 주기가 포함됩니다. 비가 오면 모든 밭에 물이 공급되고, 건조한 날 물을 주지 않은 밭은 그날 밤 자라지 않습니다. 밀과 당근은 한 단위를 수확하면 비워지고, 토마토는 다시 관리된 밤을 보내면 다음 단위가 익습니다. 하루 세 명까지 임시 고용할 수 있고 비용은 차례로 1·1·2, 작업은 한 명당 1회 늘어납니다. 고용은 다음 날 초기화됩니다. 시드는 비(하루 확률 45%)와 독립적인 일별 판매가(기준가 × uniform[0.8,1.2], 반올림)를 고정합니다. 수확 즉시 판매하며 열흘이 끝나면 현금만 계산합니다. 작물 잔존가치·토지 구매·이동·상대·시장 영향은 포함하지 않습니다. 같은 시드로 경로를 비교하면 날씨와 가격이 고정됩니다."
