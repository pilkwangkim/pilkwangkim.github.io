games-orbit-intercept:
  bundle: games
  title: {en: "Re-aim when the ship count changes", ko: "함선 수를 바꾸면 도착 위치도 다시 조준하기"}
  note: {en: "Authored isolated scene: board [0,100]², sun center (50,50), radius 10 and safety margin 1.5; fleet speed follows the article. Source (12,25), source/target radii 3/2, orbit radius 30, launch clearance 0.1 and an 80-turn exact-integer search are example settings. No other fleets or combat are simulated.", ko: "작성한 독립 장면입니다. 보드 [0,100]², 태양 중심 (50,50), 반지름 10·안전 여유 1.5와 원문의 함대 속도식을 씁니다. 출발점 (12,25), 출발·목표 반지름 3·2, 공전 반지름 30, 발사 여유 0.1과 정수 턴을 정확히 맞추는 80턴 탐색은 예제 설정입니다. 다른 함대나 전투는 모의하지 않습니다."}
games-maze-tempo:
  bundle: games
  title: {en: "Transfer energy without trapping the factory", ko: "Factory의 길을 막지 않고 에너지 전달하기"}
  note: {en: "Authored 5×5 miniature, not the competition engine. Each click is one turn; both units pay 1 upkeep before one selected action. MOVE costs 1 and moves one cell; an adjacent TRANSFER moves energy but leaves the body; factory JUMP costs 3, skips two northward cells and sets cooldown 3 (ticked before later actions). The boundary rises one row every two turns; units below it leave. Other mechanics and capacities are omitted.", ko: "작성한 5×5 축소 예제이며 대회 engine이 아닙니다. 클릭 한 번이 한 턴이고 두 유닛이 유지비 1을 낸 뒤 선택한 행동 하나를 합니다. MOVE는 비용 1로 한 칸, 인접 TRANSFER는 몸체를 남기고 에너지만 옮깁니다. Factory JUMP는 비용 3으로 북쪽 두 칸을 건너고 cooldown 3을 주며 이후 행동 전에 감소합니다. 두 턴마다 경계가 한 줄 올라오고 아래 유닛은 사라집니다. 다른 규칙과 용량 제한은 생략했습니다."}
games-pokemon-policy:
  bundle: games
  title: {en: "Blend scores, then preserve the legal menu", ko: "점수를 섞어도 합법 선택 메뉴는 지키기"}
  note: {en: "Three authored expert/global/rule score vectors on a supplied legal menu. Nonnegative weights are normalized; coverage below 0.6 or an insufficient top-two score gap uses rules. These gates illustrate routing, without estimating calibration or competitive strength. The initial 60-card deck contract is outside this in-play example.", ko: "주어진 합법 메뉴에 expert·global·rule의 예시 점수 벡터를 적용합니다. 음이 아닌 가중치를 정규화하고, 지원 범위 0.6 미만이나 상위 두 점수 차이 부족이면 규칙을 씁니다. 보정 정확도나 대회 강도를 추정하지 않는 routing 예제입니다. 최초 60장 덱 반환은 이 경기 중 예제의 범위 밖입니다."}
