  <g id="text_14">
   <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #183344" x="38.88" y="59.616" transform="rotate(-0 38.88 59.616)">A shared baseline changes the decision question</text>
  </g>
  <g id="text_15">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526572" x="38.88" y="475.8912" transform="rotate(-0 38.88 475.8912)">The comparison needs matched, valid evaluation. Standalone quality and training effort do not determine the gain.</text>
  </g>
  <g id="text_16">
   <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #526572" x="38.88" y="498.1824" transform="rotate(-0 38.88 498.1824)">Conceptual only. M is the same metric on the same evaluation set; C is a declared operator, with no weights or gains asserted.</text>
  </g>
