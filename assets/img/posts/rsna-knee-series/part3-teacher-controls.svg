  <g id="text_29">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #183344" transform="translate(69.12 451.092)">Teacher and prior mixtures both use a 0.5 coefficient, but do not match target entropy.</text>
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; fill: #183344" transform="translate(69.12 470.592)">The four-target mask was informed by exposed gold58; it is not an untouched confirmation set.</text>
