<text x="35" y="45" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#183044" text-anchor="start" xml:space="preserve">Follow an explicit zero from request to repair</text>
<text x="35" y="79" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#5c6d78" text-anchor="start" xml:space="preserve">limit = the maximum number of items returned by the API</text>
