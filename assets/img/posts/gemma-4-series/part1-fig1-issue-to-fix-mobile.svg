<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1510" viewBox="0 0 390 1510" role="img" aria-labelledby="title desc">
<title id="title">Follow an explicit zero from request to repair</title><desc id="desc">A toy API uses limit as the maximum returned item count. An explicit zero becomes ten through value or default. A None-only fallback preserves None to ten, zero to zero, and five to five.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs>
