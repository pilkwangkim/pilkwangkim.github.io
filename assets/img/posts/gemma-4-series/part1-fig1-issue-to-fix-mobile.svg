<text x="24" y="35" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#183044" text-anchor="start" xml:space="preserve">Follow the value to the bug</text>
<text x="24" y="64" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#5c6d78" text-anchor="start" xml:space="preserve">limit = maximum items returned</text>
