<text x="353" y="153" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#ffffff" text-anchor="end" xml:space="preserve">API request</text>
<text x="41" y="190" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="400" fill="#183044" text-anchor="start" xml:space="preserve">GET /items?limit=0</text>
