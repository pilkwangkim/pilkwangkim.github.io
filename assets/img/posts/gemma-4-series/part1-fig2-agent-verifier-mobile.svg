<title id="title">Separate the repair workspace from fresh verification</title><desc id="desc">The GPU model server requests tools through the harness and agent loop. Two independent sandboxes start from the same repository snapshot. Only the extracted Git diff is transferred from the agent workspace to fresh verification; evaluator-held tests stay with the verifier.</desc>
