<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="885" viewBox="0 0 1120 885" role="img" aria-labelledby="title desc">
<title id="title">Separate the repair workspace from fresh verification</title><desc id="desc">The GPU model server requests tools through the harness and agent loop. Two independent sandboxes start from the same repository snapshot. Only the extracted Git diff is transferred from the agent workspace to fresh verification; evaluator-held tests stay with the verifier.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker></defs>
<rect x="0" y="0" width="1120" height="885" rx="0" fill="#fbfbf8" stroke="none" stroke-width="1.5"/>
<text x="35" y="44" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#183044" text-anchor="start" xml:space="preserve">The agent edits one checkout. The verifier tests a fresh one.</text>
<text x="35" y="79" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#5c6d78" text-anchor="start" xml:space="preserve">Model requests become tool actions; only the resulting Git diff crosses the isolation boundary.</text>
