<svg xmlns="http://www.w3.org/2000/svg" width="480" height="890" viewBox="0 0 480 890" role="img" aria-labelledby="title desc">
<title id="title">Two errors can trigger a wrong correction</title>
<desc id="desc">The transmitted Hamming word is 0110011. Channel errors at positions 3 and 5 produce 0100111, with syndrome index 6. A single-error decoder flips position 6 and returns a different valid word, 0100101, whose extracted message is 0101 rather than 1011. The original and returned words have Hamming distance three; the channel and the decoder together traverse the three-edge path.</desc>
