<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="title desc">
<title id="title">Encoding makes some received words invalid</title>
<desc id="desc">Message 1011 encodes to the Hamming word 0110011. A bit flip at position 5 changes it to 0110111. The receiver does not know the original word, but failed parity checks locate position 5 when at most one bit has flipped. Correction restores 0110011 and extracts message 1011.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="context-stroke"/></marker></defs>
<rect width="960" height="530" fill="#fcfbf8"/>
<text x="38" y="45" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="500" fill="#203548" text-anchor="start">One message, one flipped bit</text>
<text x="38" y="98" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="27" font-weight="400" fill="#087f83" text-anchor="start">Message  1011</text>
<text x="922" y="98" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#617282" text-anchor="end">Data positions: 3, 5, 6, 7</text>
<text x="38" y="176" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#617282" text-anchor="start">Transmit</text>
<rect x="221" y="137" width="66" height="55" rx="6" fill="#f5ecd9" stroke="#a46c28" stroke-width="2"/>
<text x="254.0" y="175" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="32" font-weight="500" fill="#a46c28" text-anchor="middle">0</text>
<text x="254.0" y="222" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="22" font-weight="400" fill="#a46c28" text-anchor="middle">p1</text>
<rect x="294" y="137" width="66" height="55" rx="6" fill="#f5ecd9" stroke="#a46c28" stroke-width="2"/>
<text x="327.0" y="175" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="32" font-weight="500" fill="#a46c28" text-anchor="middle">1</text>
<text x="327.0" y="222" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="22" font-weight="400" fill="#a46c28" text-anchor="middle">p2</text>
<rect x="367" y="137" width="66" height="55" rx="6" fill="#ffffff" stroke="#d8e0e3" stroke-width="1.3"/>
<text x="400.0" y="175" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="32" font-weight="500" fill="#203548" text-anchor="middle">1</text>
<text x="400.0" y="222" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="22" font-weight="400" fill="#087f83" text-anchor="middle">d1</text>
<rect x="440" y="137" width="66" height="55" rx="6" fill="#f5ecd9" stroke="#a46c28" stroke-width="2"/>
<text x="473.0" y="175" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="32" font-weight="500" fill="#a46c28" text-anchor="middle">0</text>
<text x="473.0" y="222" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="22" font-weight="400" fill="#a46c28" text-anchor="middle">p4</text>
<rect x="513" y="137" width="66" height="55" rx="6" fill="#ffffff" stroke="#d8e0e3" stroke-width="1.3"/>
<text x="546.0" y="175" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="32" font-weight="500" fill="#203548" text-anchor="middle">0</text>
<text x="546.0" y="222" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="22" font-weight="400" fill="#087f83" text-anchor="middle">d2</text>
