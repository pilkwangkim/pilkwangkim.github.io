<text x="38" y="335" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#617282" text-anchor="start">Receive</text>
<rect x="221" y="296" width="66" height="55" rx="6" fill="#ffffff" stroke="#d8e0e3" stroke-width="1.3"/>
<text x="254.0" y="334" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="32" font-weight="500" fill="#203548" text-anchor="middle">0</text>
