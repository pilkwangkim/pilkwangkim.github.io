<text x="400.0" y="334" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="32" font-weight="500" fill="#203548" text-anchor="middle">1</text>
<rect x="440" y="296" width="66" height="55" rx="6" fill="#ffffff" stroke="#d8e0e3" stroke-width="1.3"/>
<text x="473.0" y="334" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="32" font-weight="500" fill="#203548" text-anchor="middle">0</text>
<rect x="513" y="296" width="66" height="55" rx="6" fill="#f8e8e5" stroke="#b84c46" stroke-width="2"/>
<text x="546.0" y="334" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="32" font-weight="500" fill="#b84c46" text-anchor="middle">1</text>
<rect x="586" y="296" width="66" height="55" rx="6" fill="#ffffff" stroke="#d8e0e3" stroke-width="1.3"/>
<text x="619.0" y="334" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="32" font-weight="500" fill="#203548" text-anchor="middle">1</text>
<rect x="659" y="296" width="66" height="55" rx="6" fill="#ffffff" stroke="#d8e0e3" stroke-width="1.3"/>
<text x="692.0" y="334" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="32" font-weight="500" fill="#203548" text-anchor="middle">1</text>
<text x="922" y="332" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#b84c46" text-anchor="end">checks fail</text>
<text x="38" y="412" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#617282" text-anchor="start">Syndrome</text>
<text x="222" y="412" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="26" font-weight="400" fill="#b84c46" text-anchor="start">(1, 0, 1)  →  position 5</text>
<line x1="38" y1="446" x2="921" y2="446" stroke="#d8e0e3" stroke-width="2"/>
<text x="38" y="492" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="27" font-weight="400" fill="#087f83" text-anchor="start">Correct: 0110011</text>
<text x="921" y="492" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="27" font-weight="400" fill="#087f83" text-anchor="end">Decode: 1011</text>
