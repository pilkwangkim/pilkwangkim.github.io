<text x="619.0" y="175" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="32" font-weight="500" fill="#203548" text-anchor="middle">1</text>
<text x="619.0" y="222" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="22" font-weight="400" fill="#087f83" text-anchor="middle">d3</text>
<rect x="659" y="137" width="66" height="55" rx="6" fill="#ffffff" stroke="#d8e0e3" stroke-width="1.3"/>
<text x="692.0" y="175" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="32" font-weight="500" fill="#203548" text-anchor="middle">1</text>
