<text x="38" y="44" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="500" fill="#203548" text-anchor="start">One error still leaves a unique answer</text>
<text x="38" y="89" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#617282" text-anchor="start">3-bit repetition code: 000 and 111</text>
