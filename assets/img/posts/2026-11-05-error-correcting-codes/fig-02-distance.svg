<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
<title id="title">Disjoint one-error neighborhoods of the repetition code</title>
<desc id="desc">The eight vertices are all three-bit words. Each cube edge changes exactly one bit. Teal vertices 000, 001, 010, 100 are within Hamming distance one of 000. Gold vertices 111, 110, 101, 011 are within distance one of 111. The neighborhoods share no word. Geometric edge lengths on the page do not measure Hamming distance.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="context-stroke"/></marker></defs>
