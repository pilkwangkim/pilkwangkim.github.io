<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Error-correcting codes</title>
<desc id="desc">A seven-bit Hamming word 0110011 suffers an error in position 5. Parity checks 1 and 4 fail, producing syndrome (1,0,1), whose weighted index is 5. The flipped bit is restored under the single-error assumption.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="context-stroke"/></marker></defs>
