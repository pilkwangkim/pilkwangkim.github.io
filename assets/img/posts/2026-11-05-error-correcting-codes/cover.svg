<text x="47" y="70" font-family="DejaVu Sans, Arial, sans-serif" font-size="47" font-weight="600" fill="#203548" text-anchor="start">Error-correcting codes</text>
<text x="49" y="110" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="26" font-weight="400" fill="#617282" text-anchor="start">Hamming(7,4): 1011 → 0110011</text>
<text x="49" y="173" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#617282" text-anchor="start">One flipped bit</text>
<text x="48" y="226" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#617282" text-anchor="start">Received</text>
