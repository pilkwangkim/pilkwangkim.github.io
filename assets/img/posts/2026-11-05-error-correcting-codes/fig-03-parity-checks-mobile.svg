<svg xmlns="http://www.w3.org/2000/svg" width="480" height="725" viewBox="0 0 480 725" role="img" aria-labelledby="title desc">
<title id="title">Parity-check memberships identify an error in position five</title>
<desc id="desc">Columns are positions 1 through 7, whose roles are p1, p2, d1, p4, d2, d3, d4. Row s1 includes 1,3,5,7; row s2 includes 2,3,6,7; row s4 includes 4,5,6,7. Each included entry is one. The highlighted fifth column is (1,0,1), so an error at position 5 fails precisely checks 1 and 4.</desc>
