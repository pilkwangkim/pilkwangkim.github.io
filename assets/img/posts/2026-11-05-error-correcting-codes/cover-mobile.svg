<line x1="30" y1="480" x2="450" y2="480" stroke="#d8e0e3" stroke-width="2"/>
<text x="30" y="527" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#617282" text-anchor="start">Syndrome</text>
<text x="231" y="527" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="30" font-weight="400" fill="#b84c46" text-anchor="start">1 0 1</text>
<text x="30" y="569" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="25" font-weight="400" fill="#203548" text-anchor="start">1 + 2·0 + 4·1 = 5</text>
<text x="30" y="615" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="23" font-weight="400" fill="#087f83" text-anchor="start">Correct bit 5  →  0110011</text>
