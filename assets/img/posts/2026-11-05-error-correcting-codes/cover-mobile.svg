<text x="30" y="96" font-family="DejaVu Sans, Arial, sans-serif" font-size="35" font-weight="600" fill="#203548" text-anchor="start">codes</text>
<text x="30" y="140" font-family="DejaVu Sans Mono, Menlo, monospace" font-size="24" font-weight="400" fill="#617282" text-anchor="start">1011 → 0110011</text>
