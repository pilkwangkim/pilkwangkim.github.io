<svg xmlns="http://www.w3.org/2000/svg" width="480" height="820" viewBox="0 0 480 820" role="img" aria-labelledby="title desc">
<title id="title">Encoding makes some received words invalid</title>
<desc id="desc">Message 1011 encodes to the Hamming word 0110011. A bit flip at position 5 changes it to 0110111. The receiver does not know the original word, but failed parity checks locate position 5 when at most one bit has flipped. Correction restores 0110011 and extracts message 1011.</desc>
