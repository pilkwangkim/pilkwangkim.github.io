<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">Chemistry: compress the data and price the whole block encoding</title><desc id="desc">ANGLE lookup, state preparation, and rotations contribute to the full resource cost.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#526776"/></marker></defs>
<rect width="1200" height="850" rx="18" fill="#fbfbf8"/>
<text x="40" y="54" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#183044">Chemistry: compress the data and price the whole block encoding</text>
<text x="40" y="91" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#526776">ANGLE lookup, state preparation, and rotations contribute to the full resource cost.</text>
<rect x="40" y="140" width="520" height="185" rx="14" fill="#fbefe5" stroke="#d6e0e5" stroke-width="2"/>
<text x="60" y="179" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#183044">Hamiltonian H̃</text>
<text x="60" y="222" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#183044">An energy operator, generally not unitary</text>
<text x="60" y="256" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#183044">So it cannot simply be used as one gate</text>
<text x="60" y="290" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#183044">Coefficients describe electron interactions</text>
<line x1="571" y1="232" x2="625" y2="232" stroke="#526776" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="640" y="140" width="520" height="185" rx="14" fill="#edf3f8" stroke="#d6e0e5" stroke-width="2"/>
<text x="660" y="180" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#183044">Embed it inside a larger unitary U</text>
<rect x="690" y="198" width="160" height="100" rx="14" fill="#e9f5f1" stroke="#248475" stroke-width="2"/>
<rect x="850" y="198" width="95" height="100" rx="14" fill="white" stroke="#d6e0e5" stroke-width="2"/>
<text x="770" y="258" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#183044">H̃ / α</text>
<text x="898" y="257" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" text-anchor="middle" fill="#183044">…</text>
<text x="975" y="242" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#183044">Ancilla-zero</text>
<text x="975" y="271" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#183044">block</text>
<rect x="40" y="400" width="330" height="235" rx="14" fill="#fbefe5" stroke="#d6e0e5" stroke-width="2"/>
<text x="60" y="439" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#183044">Classical design</text>
<text x="60" y="482" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#183044">Reference electron integrals</text>
<text x="60" y="516" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#183044">DFTHC vectors + weights</text>
<text x="60" y="550" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#183044">Givens tree + angle precision</text>
<text x="60" y="584" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#183044">Changes accuracy and λ_eff</text>
<rect x="435" y="400" width="330" height="235" rx="14" fill="#e9f5f1" stroke="#d6e0e5" stroke-width="2"/>
<text x="455" y="439" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#183044">Submitted ANGLE QROM</text>
<text x="455" y="482" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#183044">Read angle words coherently</text>
<text x="455" y="516" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#183044">Stream batches using XOR</text>
<text x="455" y="550" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#183044">Test addresses + cleanup</text>
<text x="455" y="584" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#183044">≤128 qubits per circuit</text>
<rect x="830" y="400" width="330" height="235" rx="14" fill="#edf3f8" stroke="#d6e0e5" stroke-width="2"/>
<text x="850" y="439" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#183044">Additional priced work</text>
<text x="850" y="482" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#183044">Outer + inner state preparation</text>
<text x="850" y="516" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#183044">Givens rotations and reverses</text>
<text x="850" y="550" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#183044">Persistent + shared workspace</text>
<text x="850" y="584" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#183044">Analytical resource formulas</text>
<line x1="376" y1="520" x2="426" y2="520" stroke="#526776" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="205" y1="635" x2="205" y2="668" stroke="#526776" stroke-width="2"/>
<line x1="205" y1="668" x2="995" y2="668" stroke="#526776" stroke-width="2"/>
<line x1="995" y1="668" x2="995" y2="643" stroke="#526776" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="40" y="707" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#183044">Full cost = λ_eff × T_total × Q_total</text>
<text x="40" y="750" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#183044">The original README reports: angle circuit Q=119; whole-block Q_total=730.</text>
<text x="40" y="796" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#526776">Those are different resources. The 128-qubit cap does not cap the whole block.</text>
</svg>
