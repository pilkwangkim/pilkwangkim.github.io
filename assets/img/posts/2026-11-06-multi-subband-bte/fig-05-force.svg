<text x="30.00" y="89.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#657887" text-anchor="start">ε<tspan baseline-shift="sub" font-size="72%">n</tspan>(x) = (50 + 70x/L) meV · E = 170 meV</text>
<text x="85.00" y="151.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="500" fill="#203649" text-anchor="start">(a) Energy conversion</text>
