<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1200" viewBox="0 0 600 1200" role="img" aria-labelledby="title desc">
<title id="title">A rising subband edge converts axial kinetic energy into potential energy</title>
<desc id="desc">The prescribed subband edge epsilon(x)=50+70x/L meV rises from 50 to 120 meV while total energy is 170 meV. Panel a shows the energy gap K_n=E-epsilon_n. Panel b shows k_x(x)=sqrt(2 m* (E-epsilon_n(x)))/hbar for mass 0.19m0. A right mover slows from positive k about 0.774 to 0.499 per nanometre without turning. The arrow follows increasing x, not a changing quantum phase. The force is minus the derivative of the included subband energy.</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="context-stroke"/></marker></defs>
<rect width="600" height="1200" fill="#fbfcfb"/>
<text x="30.00" y="46.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="500" fill="#203649" text-anchor="start">A rising edge slows the electron</text>
<text x="30.00" y="89.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#657887" text-anchor="start">ε<tspan baseline-shift="sub" font-size="72%">n</tspan>(x) = (50 + 70x/L) meV · E = 170 meV</text>
<text x="30.00" y="151.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="500" fill="#203649" text-anchor="start">(a) Energy conversion</text>
<text x="30.00" y="721.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="500" fill="#203649" text-anchor="start">(b) Semiclassical trajectory</text>
