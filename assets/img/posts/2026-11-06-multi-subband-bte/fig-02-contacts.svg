<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">Half-range reservoir boundary conditions</title>
<desc id="desc">Solid arrows cross each incoming boundary from a reservoir; dashed arrows carry outgoing occupations to the reservoir. Blue is positive velocity and gold is negative velocity. Only f-plus at x=0 and f-minus at x=L are fixed. The interior occupations and the two outgoing halves are transport unknowns. Mobile stacks the reservoir labels but keeps the physical x direction horizontal.</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="context-stroke"/></marker></defs>
<rect width="1200" height="570" fill="#fbfcfb"/>
<text x="30.00" y="47.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="500" fill="#203649" text-anchor="start">Reservoir boundary conditions</text>
<line x1="45.00" y1="93.00" x2="77.00" y2="93.00" stroke="#657887" stroke-width="3.8"/>
<text x="89.00" y="101.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#657887" text-anchor="start">Inflow fixed</text>
<line x1="365.00" y1="93.00" x2="397.00" y2="93.00" stroke="#657887" stroke-width="3.8" stroke-dasharray="9 7"/>
<text x="409.00" y="101.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#657887" text-anchor="start">Outflow solved</text>
<rect x="40.00" y="176.00" width="205.00" height="205.00" rx="8" fill="#f2f6f6" stroke="#d9e2e6" stroke-width="1.5"/>
<rect x="955.00" y="176.00" width="205.00" height="205.00" rx="8" fill="#f2f6f6" stroke="#d9e2e6" stroke-width="1.5"/>
<text x="142.00" y="216.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="500" fill="#2b6090" text-anchor="middle">Left reservoir</text>
<text x="142.00" y="282.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="400" fill="#2b6090" text-anchor="middle">fL(E)</text>
<text x="1057.00" y="216.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="500" fill="#a46e26" text-anchor="middle">Right reservoir</text>
<text x="1057.00" y="282.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="400" fill="#a46e26" text-anchor="middle">fR(E)</text>
<text x="600.00" y="163.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="400" fill="#203649" text-anchor="middle">Uniform wire · subband n</text>
<rect x="330.00" y="200.00" width="540.00" height="155.00" rx="4" fill="#ffffff" stroke="#d9e2e6" stroke-width="1.5"/>
<line x1="225.00" y1="238.00" x2="350.00" y2="238.00" stroke="#2b6090" stroke-width="3.7" marker-end="url(#arrow)"/>
<line x1="850.00" y1="238.00" x2="975.00" y2="238.00" stroke="#2b6090" stroke-width="3.2" marker-end="url(#arrow)" stroke-dasharray="9 7"/>
<line x1="975.00" y1="313.00" x2="850.00" y2="313.00" stroke="#a46e26" stroke-width="3.7" marker-end="url(#arrow)"/>
<line x1="350.00" y1="313.00" x2="225.00" y2="313.00" stroke="#a46e26" stroke-width="3.2" marker-end="url(#arrow)" stroke-dasharray="9 7"/>
<text x="584.00" y="250.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="400" fill="#2b6090" text-anchor="middle">f<tspan baseline-shift="sub" font-size="72%">n</tspan>⁺(x,E)</text>
<text x="584.00" y="325.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="400" fill="#a46e26" text-anchor="middle">f<tspan baseline-shift="sub" font-size="72%">n</tspan>⁻(x,E)</text>
<text x="748.00" y="250.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#2b6090" text-anchor="start">v<tspan baseline-shift="sub" font-size="72%">n</tspan> &gt; 0</text>
<text x="748.00" y="325.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#a46e26" text-anchor="start">v<tspan baseline-shift="sub" font-size="72%">n</tspan> &lt; 0</text>
<text x="330.00" y="407.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" fill="#657887" text-anchor="middle">x = 0</text>
<text x="870.00" y="407.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" fill="#657887" text-anchor="middle">x = L</text>
<text x="45.00" y="466.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="400" fill="#2b6090" text-anchor="start">f<tspan baseline-shift="sub" font-size="72%">n</tspan>⁺(0,E) = fL(E)</text>
<text x="1155.00" y="466.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="400" fill="#a46e26" text-anchor="end">f<tspan baseline-shift="sub" font-size="72%">n</tspan>⁻(L,E) = fR(E)</text>
<text x="600.00" y="536.00" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="400" fill="#203649" text-anchor="middle">The interior and outgoing occupations are solved.</text>
</svg>
