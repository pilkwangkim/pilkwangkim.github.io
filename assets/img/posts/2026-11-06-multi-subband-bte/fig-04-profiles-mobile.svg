<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1310" viewBox="0 0 600 1310" role="img" aria-labelledby="title desc">
<title id="title">Elastic backscattering and directional imbalance</title>
<desc id="desc">Exact continuum single-subband solutions use incoming occupations fL=0.9 and fR=0.2. Panel a has beta L=0; panel b has beta L=2. Positive-direction occupation is blue solid and negative-direction occupation is gold dashed. Both spatial derivatives in panel b are negative and equal, leaving a constant difference 0.7/3 instead of the ballistic 0.7. Filled points identify only the prescribed incoming values at the left positive and right negative boundary.</desc>
