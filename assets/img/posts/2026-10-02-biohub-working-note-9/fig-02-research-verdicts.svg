   <g id="text_1">
    <text style="font-weight: 700; font-size: 18.72px; font-family: 'Arial'; text-anchor: start; fill: #087f8c" x="64.8" y="52.279425" transform="rotate(-0 64.8 52.279425)">BIOHUB CELL TRACKING / NOTE 9</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 33.12px; font-family: 'Arial'; text-anchor: start; fill: #1d252d" x="64.8" y="101.870325" transform="rotate(-0 64.8 101.870325)">Four findings, four different next actions</text>
   </g>
   <g id="text_3">
    <text style="font-size: 22.32px; font-family: 'Helvetica Neue'; text-anchor: start; fill: #586570" x="64.8" y="141.395737" transform="rotate(-0 64.8 141.395737)">A conceptual map of evidence scope, not measured effect sizes</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 27.36px; font-family: 'Arial'; text-anchor: start; fill: #b55332" x="86.4" y="232.703775" transform="rotate(-0 86.4 232.703775)">Negative graph result</text>
   </g>
   <g id="text_5">
    <text style="font-size: 23.04px; font-family: 'Helvetica Neue'; text-anchor: start; fill: #1d252d" x="86.4" y="289.332" transform="rotate(-0 86.4 289.332)">The measured composition loses.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 23.04px; font-family: 'Helvetica Neue'; fill: #586570" transform="translate(86.4 342.612)">Reject that composition; inspect</text>
    <text style="font-size: 23.04px; font-family: 'Helvetica Neue'; fill: #586570" transform="translate(86.4 367.7166)">where the loss occurs.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 27.36px; font-family: 'Arial'; text-anchor: start; fill: #087f8c" x="691.2" y="233.037225" transform="rotate(-0 691.2 233.037225)">Training insufficient</text>
   </g>
   <g id="text_8">
    <text style="font-size: 23.04px; font-family: 'Helvetica Neue'; text-anchor: start; fill: #1d252d" x="691.2" y="289.332" transform="rotate(-0 691.2 289.332)">The model did not learn enough.</text>
   </g>
   <g id="text_9">
    <text style="font-size: 23.04px; font-family: 'Helvetica Neue'; fill: #586570" transform="translate(691.2 343.0008)">Check exposure and convergence;</text>
    <text style="font-size: 23.04px; font-family: 'Helvetica Neue'; fill: #586570" transform="translate(691.2 368.6121)">justify any change in support.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 27.36px; font-family: 'Arial'; text-anchor: start; fill: #687887" x="86.4" y="498.383775" transform="rotate(-0 86.4 498.383775)">Execution incomplete</text>
   </g>
   <g id="text_11">
    <text style="font-size: 23.04px; font-family: 'Helvetica Neue'; text-anchor: start; fill: #1d252d" x="86.4" y="555.012" transform="rotate(-0 86.4 555.012)">The run did not reach scoring.</text>
   </g>
   <g id="text_12">
    <text style="font-size: 23.04px; font-family: 'Helvetica Neue'; fill: #586570" transform="translate(86.4 608.292)">Repair the blocked execution;</text>
    <text style="font-size: 23.04px; font-family: 'Helvetica Neue'; fill: #586570" transform="translate(86.4 633.6261)">measure before judging quality.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 27.36px; font-family: 'Arial'; text-anchor: start; fill: #716394" x="691.2" y="498.383775" transform="rotate(-0 691.2 498.383775)">Bounded diagnostic</text>
   </g>
   <g id="text_14">
    <text style="font-size: 23.04px; font-family: 'Helvetica Neue'; text-anchor: start; fill: #1d252d" x="691.2" y="555.012" transform="rotate(-0 691.2 555.012)">The probe answers a narrow question.</text>
   </g>
   <g id="text_15">
    <text style="font-size: 23.04px; font-family: 'Helvetica Neue'; fill: #586570" transform="translate(691.2 608.292)">Use it to choose the next test;</text>
    <text style="font-size: 23.04px; font-family: 'Helvetica Neue'; fill: #586570" transform="translate(691.2 633.3966)">keep its interpretation within scope.</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 28.08px; font-family: 'Arial'; text-anchor: start; fill: #1d252d" x="64.8" y="762.419137" transform="rotate(-0 64.8 762.419137)">Search exhaustion needs broader evidence</text>
   </g>
   <g id="text_17">
    <text style="font-size: 21.6px; font-family: 'Helvetica Neue'; text-anchor: start; fill: #586570" x="64.8" y="803.10375" transform="rotate(-0 64.8 803.10375)">Across viable alternatives, training support, and complete pipelines.</text>
   </g>
